<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大脑执行层 · 能力位视图</title><style>
:root{
  --bg:#0B0B14; --surface:#12121E; --surface-2:#171726; --line:rgba(0,229,255,.10);
  --line-soft:rgba(0,229,255,.06);
  --gold:#F5B041; --cyan:#00E5FF; --violet:#7C4DFF;
  --text:#E9E9F2; --dim:#8B8BA3; --dim-2:#5C5C74;
  --ok:#3DDC97; --warn:#F5B041; --bad:#FF6B6B;
  --r-lg:14px; --r-sm:8px; --gap:14px;
  --shadow-1:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(4,8,20,.7);
  --shadow-2:0 0 0 1px rgba(0,229,255,.06), 0 6px 24px -8px rgba(4,10,28,.9),
             0 18px 48px -24px rgba(0,229,255,.12);
  --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
}
/* §5 动效纪律（硬）：尊重系统"减少动效"偏好 —— 一律停掉动画与过渡 */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased}
body{padding:20px 22px 40px;max-width:1680px;margin:0 auto}
a{color:var(--cyan);text-decoration:none}
h1{font-size:22px;font-weight:650;letter-spacing:.02em;margin:0 0 4px}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px}
.sub{color:var(--dim);font-size:12px;margin:0 0 16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line-soft);padding-bottom:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:7px;border:1px solid rgba(245,176,65,.5);
  background:radial-gradient(120% 120% at 30% 20%,rgba(245,176,65,.35),rgba(124,77,255,.18) 60%,transparent);
  box-shadow:0 0 18px -4px rgba(245,176,65,.5)}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;
  box-shadow:var(--shadow-2)}
.src{color:var(--dim-2);font-size:11px;font-family:var(--mono)}
.na{font-family:var(--mono);font-size:22px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap)}
.mut{color:var(--dim);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11px;color:var(--dim);background:rgba(0,229,255,.03)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.ic{width:14px;height:14px;display:inline-block;vertical-align:-2px;stroke:currentColor;
  fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.rw{display:grid;grid-template-columns:150px 62px 64px minmax(0,1fr);gap:10px;
  align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.rw:last-child{border-bottom:0}
.nm{font-family:var(--mono);font-size:12px}
.tg{font-size:11px;padding:1px 7px;border-radius:999px;text-align:center}
.tg.ok{color:#22C55E;background:rgba(34,197,94,.12)}
.tg.warn{color:#F5B041;background:rgba(245,176,65,.12)}
.desc{grid-column:1/-1;font-size:11.5px;color:var(--dim-2);line-height:1.5}
</style></head><body>
<!-- 开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属 -->
<div class="top"><div class="brand"><span class="mark"></span>
<div><h1>大脑执行层 · 能力位视图</h1><div class="sub">brain* 位逐个现读 · 注册表为唯一真相</div></div></div>
<div class="chip">2026-11-04 16:04 · 快照内联 · 数据源 console_hub</div></div>


<div class="wrap">
  <div class="card"><h2>这一页是什么</h2>
    <p class="mut">大脑执行层的**能力位视图**：把注册表里所有 <code>brain*</code> 位逐个列出来 ——
    名字、是否只读、要不要票、需不需要参数，全部现读，没有一个是手写的。</p>
    <div class="src">数据源 caps_registry.all_caps() · 筛选 name.startswith("brain")</div></div>
  <div class="card"><h2>能力位 <span class="mut" id="n"></span></h2><div id="list"></div>
    <div class="src">每位一行；红=需授权 · 绿=只读</div></div>
</div>
<script>
const D = [{"n": "brain_route", "d": "llm", "s": true, "sc": [], "p": true, "t": "大脑执行层·路由维：意图→能力动态路由（语义匹配+备选建议）"}, {"n": "brain_execute", "d": "llm", "s": true, "sc": [], "p": true, "t": "大脑执行层·执行维：单能力直调或多能力并行（万能插线程池）"}, {"n": "brain_verify", "d": "llm", "s": true, "sc": [], "p": false, "t": "大脑执行层·验证维：触手肉眼验证现实（视觉指纹+UIA穿透读回）"}, {"n": "brain_health", "d": "llm", "s": true, "sc": [], "p": false, "t": "大脑执行层·健康维：五维自检评分（路由/执行/触手/视觉/审计）"}, {"n": "brain_unify", "d": "llm", "s": true, "sc": [], "p": true, "t": "大脑执行层·五维合一：一次跑完 route → execute → verify → health（**是顺序串链，数据顺着走**：route 的 best.kind 喂给 execute，chain 字典逐步累积）。🔴 2026-09-22 更正：这里原先写着「**星形**，unify 直接分别调四维，**不是**串链，那三条边在源码里查不到」—— **那句是错的**，已实测推翻：能力位 `brain_unify` 由 `api.py:313` 直接调 `brain_exe"}, {"n": "brain_vault", "d": "mind", "s": true, "sc": [], "p": false, "t": "脑库接入：Obsidian 记忆库的读（recall=记忆总纲+收集箱）/ 写（remember=追加一条）/ 体检（status）—— 追加式、**没有任何删除路径**，写进去的想忘都忘不了"}, {"n": "brain_council", "d": "mind", "s": true, "sc": [], "p": false, "t": "脑会·编队群决策引擎：各脑出本域提案，委员长聚合裁决（纯推演·不出网·不落盘）；执行仍走主脑既有授权门"}];
document.getElementById("n").textContent = "（" + D.length + " 位）";
document.getElementById("list").innerHTML = D.map(c=>`
  <div class="rw">
    <span class="nm">${c.n}</span>
    <span class="tg ${c.s?'ok':'warn'}">${c.s?'只读':'需授权'}</span>
    <span class="mut">${c.p?'需参数':'无必填'}</span>
    <span class="src">${c.sc.length? c.sc.join(' · ') : '零作用域'}</span>
    <div class="desc">${c.t}</div>
  </div>`).join("") || '<div class="mut">注册表里没有 brain* 位</div>';
</script>
</body></html>
