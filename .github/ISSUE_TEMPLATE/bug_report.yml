name: 🐞 Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量给出可复现步骤与真实报错，**不要贴密钥/token**。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 仓库提交号或版本号（`git rev-parse HEAD`）
      placeholder: d57a406
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options: [Windows, Linux, macOS, 其它]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.12.10"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 1. 2. 3. …（能贴命令就贴命令）
      placeholder: |
        1. python -c "import gbt_allinone as g; g.run_task(...)"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含报错栈）
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我确认没有在本 Issue 里粘贴任何 token / 密钥 / 隐私数据
          required: true
