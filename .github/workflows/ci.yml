name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 冒烟（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的 stdout 默认是 cp1252，打印中文会 UnicodeEncodeError。
      # 这里强制 UTF-8，与本仓「中文输出不许静默变空」的守门口径一致。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      # action 版本：github 已弃用 Node 20 runner，checkout@v4 / setup-python@v5 会刷
      # 「Node.js 20 is deprecated」警告。2026-11-04 升至 v7（checkout v7.0.1 / setup-python v7.1.0）。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 语法编译（全仓）
        run: python -m compileall -q gbt_allinone tools

      - name: 导入与能力面冒烟
        shell: bash
        # -X faulthandler：2026-11-04 windows-latest/py3.10 曾出现退出时段错误
        # （断言全过、exit 139，重跑即绿）。加它之后段错误会打印 Python 堆栈，
        # 下次崩就能直接定位到哪个原生库，而不是只看到一个退出码。
        run: |
          python -X faulthandler - <<'PY'
          import faulthandler
          faulthandler.enable()
          import sys
          sys.path.insert(0, ".")
          import gbt_allinone as gbt
          caps = gbt.list_capabilities()
          n = len(caps)
          print("capabilities:", n)
          assert n >= 300, "能力位数量异常：%s" % n
          r = gbt.run_task("health")
          print("health ok:", bool(r.get("ok")))
          assert r.get("ok") is not False
          PY

      - name: 判据（跨平台子集）
        shell: bash
        run: |
          set -e
          python tests/test_legacy_guard.py
          python tests/test_autonomy.py

      # 口径防复发：README/README.en 的读数行必须与 data/ 里的真身一致。
      # 曾经因为「图由脚本硬编码 341 + README 手改数字」导致首屏与正文长期脱节，
      # 这里把「一致」变成 CI 判据，而不是靠人记得去改。
      - name: 文档口径与真身一致（漂移即红）
        shell: bash
        run: python tools/codex-scripts/sync-readme-figures.py --check

  # ── 判据 job（2026-11-04 新增）──────────────────────────────────────────────
  # 血账：这批判据（能力位三处齐 / 双向绑定 / 链路真调 / 六面可感知）**一直没进 CI**。
  #   原因不是懒，是结构性的 —— `state/` 整目录被 gitignore，判据的输入根本不入库，
  #   接进来也只会红。2026-11-04 给 state/ 开了 4 文件白名单之后，这个前提才成立。
  # 「判据长期不跑」= 假绿，比没有判据更坏，所以这里补上。
  gates:
    name: 判据（能力位 · 绑定 · 链路 · 六面）
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # tests/__init__.py 拒绝在「已绑定生产 store」的进程里跑测试（那是设计不是 bug），
      # 所以指到 runner 的临时目录。
      GBT_STORE_DIR: ${{ runner.temp }}/gbt_test_store

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 六面状态必须读得出来（缺件不许伪装成读失败）
        run: python tools/framework_state.py

      - name: 能力位三处齐 · 双向绑定 · 缺口有名有姓（判据 A/B/C/D）
        run: python -m unittest -v gbt_allinone.tests.test_cap_bind_bidirectional

      - name: 链路工具真调（说能操控就必须调得通）
        run: python -m unittest -v gbt_allinone.tests.test_chain_readiness

      - name: LLM 绑定
        run: python -m unittest -v gbt_allinone.tests.test_llm_bind_wired

      - name: 护栏审查（危险能力与资金转账必须仍在票门里）
        run: python tools/codex-scripts/guardrail-check.py --selftest
