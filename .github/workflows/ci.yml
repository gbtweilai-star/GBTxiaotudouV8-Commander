name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 冒烟（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的 stdout 默认是 cp1252，打印中文会 UnicodeEncodeError。
      # 这里强制 UTF-8，与本仓「中文输出不许静默变空」的守门口径一致。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法编译（全仓）
        run: python -m compileall -q gbt_allinone tools

      - name: 导入与能力面冒烟
        shell: bash
        # -X faulthandler：2026-11-04 windows-latest/py3.10 曾出现退出时段错误
        # （断言全过、exit 139，重跑即绿）。加它之后段错误会打印 Python 堆栈，
        # 下次崩就能直接定位到哪个原生库，而不是只看到一个退出码。
        run: |
          python -X faulthandler - <<'PY'
          import faulthandler
          faulthandler.enable()
          import sys
          sys.path.insert(0, ".")
          import gbt_allinone as gbt
          caps = gbt.list_capabilities()
          n = len(caps)
          print("capabilities:", n)
          assert n >= 300, "能力位数量异常：%s" % n
          r = gbt.run_task("health")
          print("health ok:", bool(r.get("ok")))
          assert r.get("ok") is not False
          PY

      - name: 判据（跨平台子集）
        shell: bash
        run: |
          set -e
          python tests/test_legacy_guard.py
          python tests/test_autonomy.py

      # 口径防复发：README/README.en 的读数行必须与 data/ 里的真身一致。
      # 曾经因为「图由脚本硬编码 341 + README 手改数字」导致首屏与正文长期脱节，
      # 这里把「一致」变成 CI 判据，而不是靠人记得去改。
      - name: 文档口径与真身一致（漂移即红）
        shell: bash
        run: python tools/codex-scripts/sync-readme-figures.py --check
