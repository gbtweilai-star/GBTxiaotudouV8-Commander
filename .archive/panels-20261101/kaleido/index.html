<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpaceBeam Lite · WebGL</title>
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#eee;
   font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
 #c{position:fixed;inset:0;width:100%;height:100%;display:block}
 #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 16px;
     background:linear-gradient(transparent,rgba(0,0,0,.75));transform:translateY(110%);
     transition:transform .25s}
 body.ui #ui{transform:none}
 .row{display:flex;gap:8px;align-items:center;margin-top:6px}
 button,select{font:inherit;background:#1b1f26;color:#e9eef7;border:1px solid #2a3140;
   border-radius:10px;padding:7px 11px}
 button.on{background:#c8452d;border-color:#c8452d}
 input[type=range]{flex:1}
 #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      text-align:center;padding:8vw;background:#05080f;z-index:9}
</style></head><body>
<canvas id="c"></canvas>
<div id="msg">正在请求相机…<br><small>若长时间没反应：iOS 只在 <b>https</b> 或 <b>localhost</b> 下给相机权限</small></div>
<div id="ui">
  <div class="row">
    <button id="cam">切换镜头</button>
    <button id="fs">全屏</button>
    <select id="preset">
      <option value="2">2 段</option><option value="3">3 段</option>
      <option value="4" selected>4 段</option><option value="6">6 段</option><option value="8">8 段</option>
    </select>
    <button id="rec">●</button>
  </div>
  <div class="row"><span>旋转</span><input id="rot" type="range" min="0" max="628" value="0"></div>
  <div class="row"><span>缩放</span><input id="zoom" type="range" min="40" max="250" value="100"></div>
</div>
<script>
const c=document.getElementById('c'), gl=c.getContext('webgl',{antialias:false});
const msg=document.getElementById('msg');
const P={seg:4,rot:0,zoom:1};

const VS=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const FS=`precision highp float;
varying vec2 uv;uniform sampler2D tex;uniform float seg,rot,zoom,aspect;uniform vec2 flip;
void main(){
  vec2 u=(uv-.5)*vec2(aspect,1.0)*flip;
  float c=cos(rot),s=sin(rot);
  u=vec2(u.x*c-u.y*s, u.x*s+u.y*c);
  float r=length(u), a=atan(u.y,u.x);
  float sec=6.2831853/max(seg,1.0);
  a=fmod(a+sec*.5,sec); a=abs(a-sec*.5);
  vec2 k=vec2(cos(a),sin(a))*r/max(zoom,.001)/vec2(aspect,1.0)+.5;
  vec3 col=texture2D(tex,k).rgb;
  float v=smoothstep(.75,.35,r);
  gl_FragColor=vec4(col*mix(.82,1.0,v),1.0);
}`;

function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);

const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(prog,n);

const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);

const hint=document.createElement('div');
hint.style.cssText='position:fixed;left:0;right:0;top:0;padding:8px 12px;font-size:12px;'+
  'background:rgba(0,0,0,.6);color:#ffd9a0;text-align:center;display:none;z-index:8';
document.body.appendChild(hint);

const video=document.createElement('video');
video.autoplay=true;video.muted=true;video.playsInline=true;
let facing='environment', stream=null;

async function start(){
  msg.style.display='flex'; msg.innerHTML='正在请求相机…';
  // 有些 WebView 里 getUserMedia 永远不 resolve 也不 reject ⇒ 超时就用测试图案
  const guard=setTimeout(()=>{
    if(!stream){
      msg.style.display='none';
      useTestPattern();
      hint.innerHTML='相机没响应（权限可能被拦）· 当前为<b>测试图案</b> · 用 Safari 打开 http://127.0.0.1:8080/kaleido/ 可拿真相机';
      hint.style.display='block';
    }
  },2500);
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280}},audio:false});
    clearTimeout(guard);
    video.srcObject=stream; await video.play();
    msg.style.display='none';
  }catch(e){
    msg.style.display='none';
    useTestPattern();
    hint.innerHTML='相机不可用（'+e.name+'）· 当前为<b>测试图案</b> · 换成 Safari 打开可拿真相机';
    hint.style.display='block';
  }
}

let testCv=null, testCtx=null, useTest=false;
function useTestPattern(){
  useTest=true;
  testCv=document.createElement('canvas'); testCv.width=960; testCv.height=960;
  testCtx=testCv.getContext('2d');
}
function drawTest(t){
  const c2=testCtx, S=960;
  c2.fillStyle='#0b1018'; c2.fillRect(0,0,S,S);
  // 同心彩色环 + 旋转扇区，能立刻看出万花筒是否生效
  for(let i=0;i<7;i++){
    c2.beginPath();
    c2.arc(S/2,S/2,60+i*55,0,Math.PI*2);
    c2.strokeStyle='hsl('+(i*47+t*40)%360+',80%,60%)';
    c2.lineWidth=26; c2.stroke();
  }
  for(let i=0;i<12;i++){
    const a=t*0.5+i*Math.PI/6;
    c2.beginPath();
    c2.moveTo(S/2,S/2);
    c2.lineTo(S/2+Math.cos(a)*S*0.46,S/2+Math.sin(a)*S*0.46);
    c2.strokeStyle='hsla('+(i*30+t*60)%360+',90%,65%,.5)';
    c2.lineWidth=10; c2.stroke();
  }
  c2.fillStyle='#fff'; c2.beginPath();
  c2.arc(S/2,S/2,26,0,Math.PI*2); c2.fill();
}

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  gl.viewport(0,0,c.width,c.height);
}
addEventListener('resize',resize); resize();

let t0=performance.now();
function draw(){
  const t=(performance.now()-t0)/1000;
  if(useTest && testCtx){
    drawTest(t);
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,testCv);
  } else if(video.readyState>=2){
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }
  gl.uniform1f(U('seg'),P.seg);
  gl.uniform1f(U('rot'),P.rot);
  gl.uniform1f(U('zoom'),P.zoom);
  gl.uniform1f(U('aspect'),c.width/c.height);
  gl.uniform2f(U('flip'),1,1);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(draw);
}
draw();

document.getElementById('preset').onchange=e=>P.seg=+e.target.value;
document.getElementById('rot').oninput=e=>P.rot=+e.target.value/100;
document.getElementById('zoom').oninput=e=>P.zoom=+e.target.value/100;
document.getElementById('cam').onclick=async()=>{
  facing = facing==='environment' ? 'user' : 'environment';
  if(stream) stream.getTracks().forEach(t=>t.stop());
  await start();
};
document.getElementById('fs').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.getElementById('rec').onclick=function(){
  this.classList.toggle('on');
  document.body.classList.toggle('ui');
};
c.onclick=()=>document.body.classList.toggle('ui');
start();
</script>

</body></html>
