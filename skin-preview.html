<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>皮肤预览</title><style>
:root{
  --bg:#0B0B14; --surface:#12121E; --surface-2:#171726; --line:rgba(0,229,255,.10);
  --line-soft:rgba(0,229,255,.06);
  --gold:#F5B041; --cyan:#00E5FF; --violet:#7C4DFF;
  --text:#E9E9F2; --dim:#8B8BA3; --dim-2:#5C5C74;
  --ok:#3DDC97; --warn:#F5B041; --bad:#FF6B6B;
  --r-lg:14px; --r-sm:8px; --gap:14px;
  --shadow-1:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(4,8,20,.7);
  --shadow-2:0 0 0 1px rgba(0,229,255,.06), 0 6px 24px -8px rgba(4,10,28,.9),
             0 18px 48px -24px rgba(0,229,255,.12);
  --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
}
/* §5 动效纪律（硬）：尊重系统"减少动效"偏好 —— 一律停掉动画与过渡 */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased}
body{padding:20px 22px 40px;max-width:1680px;margin:0 auto}
a{color:var(--cyan);text-decoration:none}
h1{font-size:22px;font-weight:650;letter-spacing:.02em;margin:0 0 4px}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px}
.sub{color:var(--dim);font-size:12px;margin:0 0 16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line-soft);padding-bottom:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:7px;border:1px solid rgba(245,176,65,.5);
  background:radial-gradient(120% 120% at 30% 20%,rgba(245,176,65,.35),rgba(124,77,255,.18) 60%,transparent);
  box-shadow:0 0 18px -4px rgba(245,176,65,.5)}
.card{background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;
  box-shadow:var(--shadow-2)}
.src{color:var(--dim-2);font-size:11px;font-family:var(--mono)}
.na{font-family:var(--mono);font-size:22px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap)}
.mut{color:var(--dim);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:11px;color:var(--dim);background:rgba(0,229,255,.03)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.ic{width:14px;height:14px;display:inline-block;vertical-align:-2px;stroke:currentColor;
  fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.one{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);
  border-radius:var(--r-sm);padding:5px 9px;font-size:11px}
.one i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.15);flex:0 0 auto}
.vn{font-family:var(--mono);color:var(--dim-2)}
.vv{font-family:var(--mono);font-size:10.5px}
</style></head><body>
<!-- 开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属 -->
<div class="top"><div class="brand"><span class="mark"></span>
<div><h1>皮肤预览</h1><div class="sub">读真实 CSS 变量 · 缺文件如实标</div></div></div>
<div class="chip">2026-11-07 13:19 · 快照内联 · 数据源 console_hub</div></div>


<div class="wrap">
  <div class="card"><h2>皮肤清单</h2>
    <p class="mut">下面每张卡对应一个**真实存在的 CSS 文件**，色块与色值都是从该文件里现读的变量，
    <b>没有一个是编的</b>；文件不在就如实标「缺」。</p>
    <div class="src">数据源：holo_pet_w3/ 下的 skin*.css 现读 --变量</div></div>
  <div id="skins"></div>
</div>
<script>
const D = [{"id": "skin-cube", "label": "立方皮肤", "rel": "holo_pet_w3/console/skin-cube.css", "exists": true, "kb": 32.2, "vars": [["--bg0", "#161718"], ["--bg1", "#1c1d1f"], ["--bg-deep", "#121314"], ["--ink", "#ececeb"], ["--ink2", "#c2c3c0"], ["--dim", "#8b8d8b"], ["--line", "rgba(255, 255, 255, 0.07)"], ["--line-strong", "rgba(255, 255, 255, 0.13)"], ["--panel", "#1d1e20"], ["--panel-raised", "#212224"], ["--console-bg", "#161718"], ["--cool", "#8fa3b8"], ["--warm", "#c96442"], ["--ok", "#5aa877"], ["--warn", "#c39a5a"], ["--danger", "#cf6a60"], ["--shadow-soft", "0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.28)"], ["--shadow-console", "0 1px 2px rgba(0, 0, 0, 0.35), 0 16px 40px rgba(0, 0, 0, 0.30)"], ["--shadow-inset", "inset 0 1px 0 rgba(255, 255, 255, 0.03)"], ["--sans", "\"Söhne\", \"Inter\", \"SF Pro Text\", -apple-system, \"Segoe UI\",\n    \"Microsoft YaHei\", system-ui, sans-serif"]]}, {"id": "page-skins", "label": "页面皮肤", "rel": "holo_pet_w3/page-skins.css", "exists": true, "kb": 1.6, "vars": [["--taste-ground", "#0B1120"], ["--taste-surface", "#111827"], ["--taste-raised", "#1A2535"], ["--taste-border", "#1E3A5F"], ["--taste-rule", "#162035"], ["--taste-control", "#1E3A5F"], ["--taste-text", "#E8ECF8"], ["--taste-muted", "#9AA4C4"], ["--taste-faint", "#6B7280"], ["--taste-accent", "#F5B041"], ["--taste-positive", "#00E5FF"], ["--taste-negative", "#EF4444"], ["--taste-warning", "#F5B041"], ["--taste-unknown", "#7C4DFF"], ["--taste-radius", "10px"], ["--taste-font", "Segoe UI, system-ui, sans-serif"], ["--taste-fs-title", "22px"], ["--taste-fs-section", "16px"], ["--taste-fs-kpi", "22px"], ["--taste-fs-body", "13px"]]}, {"id": "skin-mission-control", "label": "任务控制", "rel": "holo_pet_w3/skin-mission-control.css", "exists": true, "kb": 9.4, "vars": [["--mc-bg", "#0B1120"], ["--mc-surface", "#111827"], ["--mc-surface-hover", "#1A2535"], ["--mc-surface-active", "#1E3A5F"], ["--mc-border", "#1E3A5F"], ["--mc-border-subtle", "#162035"], ["--mc-fast", "100ms ease-in"], ["--mc-base", "150ms ease-out"], ["--mc-slow", "300ms ease-out"], ["--mc-1", "4px"], ["--mc-2", "8px"], ["--mc-3", "12px"], ["--mc-4", "16px"], ["--mc-5", "20px"], ["--mc-6", "24px"], ["--mc-8", "32px"], ["--mc-12", "48px"], ["--mc-mono", "\"JetBrains Mono\", \"Cascadia Mono\", Consolas, ui-monospace, monospace"], ["--mc-sans", "\"Segoe UI\", \"Microsoft YaHei UI\", system-ui, sans-serif"], ["--mc-r", "4px"], ["--mc-r-pill", "2px"], ["--gbt-bg", "var(--mc-bg)"], ["--gbt-panel", "var(--mc-surface)"], ["--gbt-line", "var(--mc-border)"], ["--gbt-radius", "var(--mc-r)"]]}];
document.getElementById("skins").innerHTML = D.map(s=>`
  <div class="card">
    <h2>${s.label} <span class="mut">${s.exists? s.kb+'KB':'文件缺失'}</span></h2>
    <div class="src">${s.rel}</div>
    <div class="sw">${s.vars.map(v=>`
      <div class="one"><i style="background:${v[1]}"></i>
        <span class="vn">${v[0]}</span><span class="vv">${v[1]}</span></div>`).join("")
      || '<div class="mut">该文件里没有 --变量，或文件不存在</div>'}</div>
  </div>`).join("");
</script>
</body></html>
