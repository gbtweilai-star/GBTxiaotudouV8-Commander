name: SpaceBeamLite
options:
  bundleIdPrefix: com.gbt.potato
  deploymentTarget:
    iOS: "17.0"   # 用了 onChange 双参（iOS 17）；要支持 16 就改回单参写法
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SpaceBeamLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SpaceBeamLite
        UILaunchScreen: {}
        NSCameraUsageDescription: 拍摄画面用于实时投影
        NSMicrophoneUsageDescription: 录制时同步声音
        NSPhotoLibraryAddUsageDescription: 保存录制到相册
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbt.potato.spacebeamlite
        TARGETED_DEVICE_FAMILY: "1,2"
