<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><title>VRM 运行时验收（three-vrm 官方实现 · 含 .vrma 动画）</title>
<style>
 body{margin:0;background:#0b0e14;color:#e8eef7;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
 #hud{position:fixed;left:12px;top:12px;background:rgba(10,14,22,.86);border:1px solid #223;
      border-radius:10px;padding:10px 12px;white-space:pre-wrap;max-width:660px;z-index:9}
 #log{position:fixed;left:12px;bottom:12px;background:rgba(10,14,22,.86);border:1px solid #223;
      border-radius:10px;padding:10px 12px;white-space:pre-wrap;max-width:900px;font-size:12px}
 canvas{display:block}
</style></head><body>
<div id="hud">VRM 运行时验收 · 载入中…</div>
<div id="log"></div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
  "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3/lib/three-vrm.module.js",
  "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm'
let createVRMAnimationClip, VRMAnimationLoaderPlugin
try { ({ createVRMAnimationClip, VRMAnimationLoaderPlugin } = await import('@pixiv/three-vrm-animation')) }
catch (e) { window.__vrmReport = { ok:false, err:'three-vrm-animation 导入失败: '+e }; document.getElementById('hud').textContent='❌ '+e; throw e }

const q = new URLSearchParams(location.search)
const vrmUrl = q.get('vrm') || '/gbt-master/fs/holo_pet/assets/digital-human/raw/rig/avatar-vrm-check.glb'
const vrmaUrl = q.get('vrma') || ''
const out = (s) => { document.getElementById('log').textContent += s + '\n' }

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1)
document.body.appendChild(renderer.domElement)
renderer.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0e14)
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 2.2))
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(1, 2, 1.6); scene.add(dl)
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100)

const loader = new GLTFLoader()
loader.register((parser) => new VRMLoaderPlugin(parser))
loader.register((parser) => new VRMAnimationLoaderPlugin(parser))   // ← 读 .vrma 必须注册这个
const clock = new THREE.Clock()
let boneProbe = null

loader.load(vrmUrl, async (gltf) => {
  const vrm = gltf.userData.vrm
  if (!vrm) { window.__vrmReport = { ok:false, err:'not a VRM' }; return }
  try { VRMUtils.removeUnnecessaryVertices(gltf.scene); VRMUtils.combineSkeletons(gltf.scene) } catch (e) {}
  scene.add(vrm.scene)
  const hb = vrm.humanoid ? vrm.humanoid.humanBones : {}
  const mapped = Object.keys(hb).filter((k) => hb[k] && hb[k].node)
  const exprs = vrm.expressionManager ? Object.keys(vrm.expressionManager.expressionMap) : []
  const springs = vrm.springBoneManager ? vrm.springBoneManager.joints.size : 0
  const meta = vrm.meta || {}
  boneProbe = mapped.map((k) => hb[k].node)          // 扫**全部**人形骨，取最大转动（别只盯一根）
  const r = { ok: mapped.length >= 15, humanoid: mapped.length, expressions: exprs.length,
              springJoints: springs, meta: { name: meta.name, authors: meta.authors, licenseUrl: meta.licenseUrl } }

  if (vrmaUrl) {
    try {
      const g2 = await loader.loadAsync(vrmaUrl)
      const vrmAnim = g2.userData.vrmAnimations && g2.userData.vrmAnimations[0]
      if (!vrmAnim) throw new Error('未解析出 vrmAnimations（VRMC_vrm_animation 缺失？）')
      const clip = createVRMAnimationClip(vrmAnim, vrm)
      // 运行时把骨名规范成 Normalized_xxx，而节点真名是 mixamorigXxx ⇒ 轨道名对齐
      const stripNormalized = (e) => { e.name = e.name.replace(/Normalized_/g, '')
        if (e.tracks) e.tracks.forEach(stripNormalized) }
      stripNormalized(clip)
      const mixer = new THREE.AnimationMixer(vrm.scene)
      mixer.clipAction(clip).play()
      r.vrmaApplied = true
      r.vrmaClip = { name: clip.name, duration: +clip.duration.toFixed(3), tracks: clip.tracks.length }
      r.trackNames = clip.tracks.slice(0, 3).map((t) => t.name)
      r.probeNames = boneProbe.slice(0, 3).map((b) => b.name)
      const before = boneProbe ? boneProbe.map((b) => b.quaternion.clone()) : null
      let maxDelta = 0, moved = 0
      const t0 = performance.now()
      while (performance.now() - t0 < 1300) {
        await new Promise((res) => requestAnimationFrame(res))
        mixer.update(clock.getDelta())
        if (boneProbe) {
          boneProbe.forEach((b, i) => {
            const d = before[i].angleTo(b.quaternion)
            if (d > 0.01) moved++
            maxDelta = Math.max(maxDelta, d)
          })
        }
      }
      r.boneMovedDeg = +(maxDelta * 57.2958).toFixed(2)
      r.bonesMoved = moved
    } catch (e) {
      r.vrmaApplied = false; r.vrmaErr = String(e).slice(0, 160)
    }
  }

  document.getElementById('hud').textContent =
    `VRM 运行时验收（three-vrm 官方实现）\n` +
    `humanoid 已映射骨   ${r.humanoid}\n` +
    `expressions         ${r.expressions}  ${exprs.slice(0,8).join(',')}\n` +
    `springBone 关节     ${r.springJoints}\n` +
    (vrmaUrl ? `VRMA 应用           ${r.vrmaApplied ? '✅ ' + r.vrmaClip.name + ' · ' + r.vrmaClip.duration + 's · ' + r.vrmaClip.tracks + ' 轨' : '❌ ' + (r.vrmaErr||'')}\n` +
               `骨头实际转动        ${r.boneMovedDeg ?? '—'}°（左大臂，采样 1.3s）\n` : '') +
    `meta.name           ${meta.name || '—'}\n` +
    `meta.authors        ${(meta.authors || []).join(' / ') || '—'}\n` +
    `meta.licenseUrl     ${meta.licenseUrl || '—'}`
  const box = new THREE.Box3().setFromObject(vrm.scene)
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3())
  const d = Math.max(size.x, size.y, size.z) * 1.9
  camera.position.set(c.x + d * 0.55, c.y + size.y * 0.16, c.z + d * 0.75)
  camera.lookAt(c)
  renderer.render(scene, camera)
  renderer.domElement.dataset.painted = '1'
  window.__vrmReport = r
  out('✅ 官方运行时读取成功：' + JSON.stringify({ humanoid: r.humanoid, expressions: r.expressions,
      springs: r.springJoints, vrma: r.vrmaApplied || null, boneMovedDeg: r.boneMovedDeg || null }))
}, undefined, (e) => { window.__vrmReport = { ok:false, err:String(e) } })
window.__ready = true
</script>
<footer class="gbt-signature" data-developer="自由的风">开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属</footer>
</body></html>
