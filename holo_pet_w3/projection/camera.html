<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GBT小土豆V8 · 摄像头投影</title>
<style>
  :root{--bg:#000}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
            font:14px -apple-system,system-ui,sans-serif;color:#e8ecf8}
  /* 画面层：摄像头实时流 */
  #wrap{position:fixed;inset:0;background:#000;
        transform:rotate(var(--rot,0deg));
        filter:invert(var(--inv,0)) brightness(var(--bri,1))}
  #cam{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  /* 控制层：点一下才出，3 秒自动收 */
  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 12px 18px;
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;
      background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,0));
      transition:opacity .25s;z-index:10}
  #ui.hide{opacity:0;pointer-events:none}
  button{background:rgba(22,30,44,.92);color:#e8ecf8;border:1px solid rgba(255,255,255,.16);
         border-radius:9px;padding:8px 13px;font-size:13px}
  button.on{background:#1d6fd6;border-color:#2f8bff}
  #hint{position:fixed;left:0;right:0;top:0;padding:10px 14px;font-size:12.5px;
        background:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,0));
        z-index:10;transition:opacity .25s}
  #hint.hide{opacity:0}
  #err{position:fixed;inset:0;display:none;padding:28px;font-size:15px;
       line-height:1.8;background:#0b1018;z-index:20;overflow:auto}
  .k{color:#7fb2ff}
</style>
</head>
<body>

<div id="wrap">
  <!-- playsinline 必须：iOS 不加会强制全屏播放器 -->
  <video id="cam" playsinline muted autoplay></video>
</div>

<div id="hint">
  <b>摄像头投影</b> · 点一下屏幕出控制条<br>
  <span style="color:#8b97a8">投墙要开「反色 + 180°」（凸透镜成倒像）</span>
</div>

<div id="ui">
  <button id="bStart">开摄像头</button>
  <button id="bFlip" class="on">投墙 180°</button>
  <button id="bInv" class="on">反色</button>
  <button id="bSwap">前置/后置</button>
  <button id="bBri">亮度 +</button>
  <button id="bFs">全屏</button>
</div>

<div id="err"></div>

<script>
(function () {
  var rot = 180, inv = 1, bri = 1.0, facing = "environment";
  var stream = null, v = document.getElementById('cam');
  var wrap = document.getElementById('wrap');
  var ui = document.getElementById('ui'), hint = document.getElementById('hint');
  var errBox = document.getElementById('err');

  function paint() {
    wrap.style.setProperty('--rot', rot + 'deg');
    wrap.style.setProperty('--inv', inv);
    wrap.style.setProperty('--bri', bri);
    document.getElementById('bFlip').classList.toggle('on', rot !== 0);
    document.getElementById('bInv').classList.toggle('on', inv === 1);
  }

  function fail(title, detail) {
    errBox.style.display = 'block';
    errBox.innerHTML = '<h3 style="margin:0 0 12px">' + title + '</h3>' +
      '<div style="color:#ff9f9f">' + detail + '</div>' +
      '<hr style="border:0;border-top:1px solid #24304a;margin:18px 0">' +
      '<div>排查顺序：<br>' +
      '① 必须用 <span class="k">Safari</span> 打开（工具内 WebView 没有摄像头权限，会一直挂住）<br>' +
      '② 设置 → Safari → 相机 → 询问/允许<br>' +
      '③ 别在其它 App 占着摄像头时开（微信/相机后台会抢）<br>' +
      '④ iOS 要求 https 或 localhost —— 本机 127.0.0.1 满足</div>';
    console.error('[GBT] camera fail:', title, detail);
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fail('这个浏览器不给摄像头 API', 'navigator.mediaDevices 不存在');
      return;
    }
    try {
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      v.srcObject = stream;
      await v.play().catch(function () {});
      document.getElementById('bStart').textContent = '已在投';
      document.getElementById('bStart').classList.add('on');
      hint.classList.add('hide');
      var tr = stream.getVideoTracks()[0];
      console.log('[GBT] camera OK:', tr.label, JSON.stringify(tr.getSettings()));
    } catch (e) {
      fail('摄像头打不开：' + (e.name || '错误'), String(e.message || e));
    }
  }

  document.getElementById('bStart').onclick = start;
  document.getElementById('bFlip').onclick = function () { rot = rot ? 0 : 180; paint(); };
  document.getElementById('bInv').onclick = function () { inv = inv ? 0 : 1; paint(); };
  document.getElementById('bSwap').onclick = function () {
    facing = (facing === 'environment') ? 'user' : 'environment';
    start();
  };
  document.getElementById('bBri').onclick = function () {
    bri = (bri >= 2.0) ? 1.0 : +(bri + 0.25).toFixed(2);
    paint();
  };
  document.getElementById('bFs').onclick = function () {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  };

  // 点屏幕：切换控制条显隐
  var t = null;
  document.addEventListener('click', function (e) {
    if (e.target.tagName === 'BUTTON') return;
    ui.classList.toggle('hide');
    hint.classList.toggle('hide');
  });

  paint();

  // 带 ?auto=1 时自动开
  if (/[?&]auto=1/.test(location.search)) {
    setTimeout(start, 300);
  }
})();
</script>

</body>
</html>
