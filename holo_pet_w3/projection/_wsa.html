<!doctype html><meta charset=utf-8>
<body style="background:#111;color:#eee;font:14px -apple-system;padding:16px">
<h3>Web Speech API 探测</h3>
<pre id="out">检测中…</pre>
<script>
const L = [];
L.push('webkitSpeechRecognition: ' + !!(window.webkitSpeechRecognition || window.SpeechRecognition));
L.push('SpeechRecognition: ' + !!window.SpeechRecognition);
L.push('speechSynthesis: ' + !!window.speechSynthesis);
L.push('isSecureContext: ' + window.isSecureContext);
try {
  const SR = window.webkitSpeechRecognition || window.SpeechRecognition;
  if (SR) {
    const r = new SR();
    r.lang = 'zh-CN';
    r.continuous = true;
    r.interimResults = true;
    L.push('已构造实例 · lang=' + r.lang);
    window.__r = r;
  }
} catch (e) { L.push('构造失败: ' + e.name + ' ' + e.message); }
document.getElementById('out').textContent = L.join('\n');
</script>
