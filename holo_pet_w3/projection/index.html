<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GBT小土豆V8 · 投影台</title>
<style>
  :root{--bg:#05080d;--ink:#e9eef7;--dim:#8fa1b8;--line:#1b2534;--acc:#6aa8ff;--amber:#f0b24c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{padding:10px 14px;border-bottom:1px solid var(--line);
         display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}
  header h1{font-size:14px;margin:0;font-weight:600}
  .sp{flex:1}
  button,select{background:#111823;color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--acc)}
  button.on{background:#1a2b45;border-color:var(--acc);color:#fff}
  button.warn{color:var(--amber);border-color:rgba(240,178,76,.4)}

  /* 舞台：所有变换都作用在这层 */
  #stage{flex:1;position:relative;background:#000;overflow:hidden;
         display:flex;align-items:center;justify-content:center}
  #stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  #stage.empty::after{content:"选一张图，或拖进来";color:var(--dim);font-size:13px}

  /* 投墙用：透镜成的是 180° 旋转的实像 ⇒ 屏幕端预转 180° 抵消 */
  #stage.flip img, #stage.flip video, #stage.flip iframe{transform:scaleX(-1) scaleY(-1)}
  #stage.mirror img, #stage.mirror video, #stage.mirror iframe{transform:scaleX(-1)}
  #stage.invert img, #stage.invert video, #stage.invert iframe{filter:invert(1) brightness(1.25)}
  #stage.invert.flip img{filter:invert(1) brightness(1.25);transform:scaleX(-1) scaleY(-1)}

  footer{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;
         color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;flex:none}
  .kbd{background:#111823;border:1px solid var(--line);border-radius:5px;
       padding:0 5px;font-family:ui-monospace,monospace;font-size:10.5px}

  /* 全屏时隐藏周边 */
  body.fs header,body.fs footer{display:none}

  #hint{position:absolute;left:10px;bottom:10px;background:rgba(5,8,13,.86);
        border:1px solid var(--line);border-radius:8px;padding:6px 10px;
        font-size:11px;color:var(--dim);max-width:70%}
</style>
</head>
<body>

<header>
  <h1>投影台</h1>
  <select id="kind" title="投影源">
    <option value="img">静态图片</option>
    <option value="live">实时页面（把她正在跑的画面投出去）</option>
  </select>
  <select id="pick">
    <option value="">— 选素材 —</option>
  </select>
  <select id="livePick" style="display:none">
    <option value="">— 选实时页 —</option>
  </select>
  <button id="bLiveFresh" style="display:none" title="强制重载实时页">⟳ 刷新源</button>
  <input id="file" type="file" accept="image/*" style="display:none">
  <button id="bFile">本地图</button>
  <button id="bFlip" class="on" title="透镜成 180° 旋转实像，屏幕端要预转 180° 抵消">投墙 180°</button>
  <button id="bInv" class="on" title="反色：白底更亮，投出去更亮">反色</button>
  <button id="bMir" title="只左右镜像（非透镜场景用）">镜像</button>
  <span class="sp"></span>
  <button id="bFs" class="warn">全屏</button>
</header>

<div id="stage" class="empty flip invert">
  <img id="img" alt="" style="display:none">
  <iframe id="live" style="display:none;width:100%;height:100%;border:0;background:#000"></iframe>
  <div id="hint">投墙：凸透镜 f≈20cm · 屏到镜头 16.7cm · 投距 1m ≈ 39×84cm · 全黑房间</div>
</div>

<footer>
  <span><span class="kbd">F</span> 全屏</span>
  <span><span class="kbd">1</span>投墙 180° <span class="kbd">2</span>反色 <span class="kbd">3</span>镜像</span>
  <span>亮度调到最高 · 画面留白多比字多更亮</span>
  <span id="info"></span>
</footer>

<script>
(() => {
  const stage = document.getElementById('stage');
  const img   = document.getElementById('img');
  const pick  = document.getElementById('pick');

  // 素材清单：仓库里现成的图（相对本页）
  const ASSETS = [
    ['../../docs/gallery/thumbs/00-poster.jpg', '开源海报'],
    ['../../docs/gallery/thumbs/01-a19-selfcheck.jpg', 'A19 自检'],
    ['../../docs/gallery/thumbs/02-tianzhen-upscale-2048x2729.jpg', '天真放大 2048×2729'],
    ['../../docs/gallery/thumbs/03-tianzhen-product-closeup.jpg', '放大后特写'],
    ['../../docs/gallery/thumbs/04-tianzhen-pipeline-constraints.jpg', '流水线与硬约束'],
    ['../../docs/gallery/thumbs/05-tianzhen-3frame-strip.jpg', '三帧拼条'],
    ['../../docs/gallery/thumbs/06-tianzhen-product-p5.jpg', 'P5 产物'],
    ['../../docs/gallery/thumbs/07-capability-doc-alignment.jpg', '能力文档对齐'],
  ];
  for (const [src, name] of ASSETS) {
    const o = document.createElement('option');
    o.value = src; o.textContent = name; pick.appendChild(o);
  }

  // ── 实时源：把她正在跑的页面直接投出去（iframe 是实时的，不是截图）──
  const LIVE = [
    // 🔴 2026-10-28：数字人也进实时源 —— 投的是她正在跑的 3D 本体（满画质），
    //   不是截图。注意本机工具内 WebView 渲染不动，这个源要在系统 Safari 里用。
    ['../digital-human/index.html?hq=1', '数字人 · 她的 3D 本体（满画质）'],
    ['../panel/index.html',            '控制面板（含镜像/巡检读数）'],
    ['../model-chat/index.html',       '对话面（她说话的地方）'],
    ['../index.html',                  '上帝视角'],
    ['../capability-bar/index.html',   '能力栏'],
    ['../logbook/index.html',          '记录本'],
    ['../blueprint/index.html',        '项目蓝图'],
    ['../../index.html',               '开源发布页'],
  ];
  const livePick = document.getElementById('livePick');
  for (const [href, name] of LIVE) {
    const o = document.createElement('option');
    o.value = href; o.textContent = name; livePick.appendChild(o);
  }

  const live = document.getElementById('live');
  const kind = document.getElementById('kind');
  const bFresh = document.getElementById('bLiveFresh');

  function setKind(k) {
    const isLive = (k === 'live');
    pick.style.display     = isLive ? 'none' : '';
    livePick.style.display = isLive ? '' : 'none';
    bFresh.style.display   = isLive ? '' : 'none';
    img.style.display      = (!isLive && img.src) ? 'block' : 'none';
    live.style.display     = isLive ? 'block' : 'none';
    if (isLive) {
      stage.classList.remove('empty');
      if (!live.src || live.src.endsWith('/projection/index.html')) {
        if (livePick.value) live.src = livePick.value;
      }
    } else {
      if (img.src) stage.classList.remove('empty');
      else stage.classList.add('empty');
    }
  }
  kind.onchange = () => setKind(kind.value);
  livePick.onchange = () => {
    if (livePick.value) {
      live.src = livePick.value;
      document.getElementById('info').textContent = '实时 · ' + livePick.selectedOptions[0].textContent;
    }
  };
  bFresh.onclick = () => { if (live.src) live.src = live.src.split('?')[0] + '?t=' + Date.now(); };

  function show(src, label) {
    img.src = src;
    img.style.display = 'block';
    stage.classList.remove('empty');
    document.getElementById('info').textContent = label || '';
  }

  pick.addEventListener('change', () => {
    if (pick.value) show(pick.value, pick.selectedOptions[0].textContent);
  });

  document.getElementById('bFile').onclick = () => document.getElementById('file').click();
  document.getElementById('file').onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const u = URL.createObjectURL(f);
    show(u, f.name + ' · ' + Math.round(f.size/1024) + 'KB');
  };

  const toggle = (btn, cls) => {
    btn.classList.toggle('on');
    stage.classList.toggle(cls);
  };
  const bFlip = document.getElementById('bFlip');
  const bInv  = document.getElementById('bInv');
  const bMir  = document.getElementById('bMir');
  bFlip.onclick = () => toggle(bFlip, 'flip');
  bInv.onclick  = () => toggle(bInv,  'invert');
  bMir.onclick  = () => toggle(bMir,  'mirror');

  // 全屏
  const bFs = document.getElementById('bFs');
  const fs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else (document.documentElement.requestFullscreen?.() || Promise.resolve())
          .catch(() => {});
    document.body.classList.toggle('fs');
  };
  bFs.onclick = fs;

  // 拖进来
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (f && f.type.startsWith('image/')) show(URL.createObjectURL(f), f.name);
  });

  // 快捷键
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') fs();
    if (e.key === '1') bFlip.click();
    if (e.key === '2') bInv.click();
    if (e.key === '3') bMir.click();
  });

  setKind('img');

  // 挂载状态：摄像头是否可用（本机 WebView 实测挂起，如实标注）
  const camNote = document.createElement('span');
  camNote.style.color = '#f0b24c';
  camNote.textContent = '⚠ 实时摄像头在本机 WebView 取不到流（getUserMedia 挂起）';
  document.querySelector('footer').appendChild(camNote);
})();
</script>
<script>
/* 🔴 2026-10-28：**纯净投墙模式** `?wall=1`
   为什么要有：真拿去投墙时，页面上任何工具栏、边距、圆角都会一起被放大到墙上。
   实物投墙的真实条件（docs/28）：凸透镜 f≈20cm · 屏到镜头 16.7cm · 全黑房间。
   wall 模式做的事：
     ① 隐藏所有 UI（工具栏、说明、按钮）—— 墙上只剩画面
     ② body 背景纯黑（透镜下黑边不发光，不干扰）
     ③ 强制 投墙180° + 反色
     ④ 画面铺满，不留边距
     ⑤ 点一下任意位置 → 进全屏（iOS 要求手势）
   退出：刷新时去掉 ?wall=1。
*/
(function () {
  if (!/[?&]wall=1/.test(location.search)) return;
  var css = document.createElement('style');
  css.textContent = [
    'body>*:not(#stage){display:none !important}',
    'body{background:#000 !important;margin:0 !important;overflow:hidden !important}',
    '#stage{position:fixed !important;inset:0 !important;width:100vw !important;',
    '  height:100vh !important;margin:0 !important;border:0 !important;',
    '  border-radius:0 !important;background:#000 !important;padding:0 !important}',
    '#stage img,#stage iframe{width:100% !important;height:100% !important;',
    '  object-fit:contain !important;border:0 !important;border-radius:0 !important}',
    '/* 投墙 180°：透镜成 180° 旋转实像，屏幕端预转抵消 */',
    '#stage.flip{transform:rotate(180deg) !important}',
    '/* 反色：白底更亮 */',
    '#stage.invert{filter:invert(1) !important}',
    '#stage.flip.invert{transform:rotate(180deg) !important;filter:invert(1) !important}'
  ].join('\n');
  document.head.appendChild(css);
  // 🔴 2026-10-28：`?src=` 真实现（上一版我在回复里说了却没写，是假话，已补）。
  //   用途：投墙时指定投什么，不用回带工具栏的界面去选。
  //     src=poster      开源海报（默认）
  //     src=hr          她的 3D 本体（满画质）
  //     src=chat        对话面（能问她）
  //     src=panel       控制面板
  //     src=<相对路径>   任意页面
  (function () {
    var q = new URLSearchParams(location.search);
    var v = (q.get('src') || '').toLowerCase();
    var MAP = {
      poster: null,
      hr: '../digital-human/index.html?hq=1',
      'digital-human': '../digital-human/index.html?hq=1',
      chat: '../model-chat/index.html',
      panel: '../panel/index.html',
      capability: '../capability-bar/index.html'
    };
    if (!v) return;
    var target = (v in MAP) ? MAP[v] : (v.indexOf('/') >= 0 || v.indexOf('.') >= 0 ? q.get('src') : null);
    var st = document.getElementById('stage');
    if (!st || !target) return;          // poster：保持默认图
    // 清掉图片，装 iframe（实时渲染，不是截图）
    st.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = target;
    f.style.cssText = 'width:100%;height:100%;border:0;display:block;background:#000';
    f.setAttribute('allow', 'autoplay');
    st.appendChild(f);
    st.classList.remove('empty');
    st.classList.add('live');
    console.log('[GBT] 投墙源 → ' + target);
  })();

  // 强制 180° + 反色
  var st = document.getElementById('stage');
  if (st) { st.classList.add('flip', 'invert'); st.classList.remove('mirror'); }
  // 点一下进全屏（iOS 需要用户手势）
  document.addEventListener('click', function () {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }, { once: true });
  console.log('[GBT] 投墙模式：UI 已隐藏 · 180°+反色 · 铺满 · 点屏进全屏');
})();
</script>
</body>
</html>
