<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GBT小土豆V8 · 认知界面</title>
<!-- 开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属 -->
<style>
  :root{--bg:#0b0b0e;--panel:#12161f;--line:#2a3140;--text:#ece9e4;--dim:#8f97a6;--warm:#ff9f1c}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
    font:400 14px/1.7 system-ui,"Segoe UI",sans-serif}
  main{max-width:1080px;margin:0 auto;padding:48px 24px 64px}
  h1{font:600 30px/1.25 system-ui;margin:0 0 10px}
  h1 span{color:var(--warm)}
  .lead{color:var(--dim);margin:0 0 26px}
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 26px}
  figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  figure img{display:block;width:100%;height:auto}
  figcaption{padding:7px 10px;font-size:11px;color:var(--dim)}
  .cta{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--warm);
    color:#151517;font-weight:600;text-decoration:none}
  .cta:hover{filter:brightness(1.06)}
  .sign{margin-top:34px;color:#5f6877;font-size:11px}
</style></head>
<body><main>
  <h1>GBT小土豆V8 · <span>认知界面</span></h1>
  <p class="lead">385 个能力位 · 21 种触手职业 · 11 个可视化视图。一个本机大脑，看得见她在怎么想、怎么扫、怎么派单。</p>
  <div class="shots">
    <figure><img src="../assets/panels/console-space.webp" alt="3D 能力星图">
      <figcaption>3D 星图 · 30 域 385 位</figcaption></figure>
    <figure><img src="../assets/panels/console-scan.webp" alt="穿透式交叉扫描">
      <figcaption>穿透扫描 · 无死角 · 疑点反思穿透</figcaption></figure>
    <figure><img src="../assets/panels/console-team.webp" alt="触手协作">
      <figcaption>触手协作 · 8 角色 × 协作链 × 脉冲</figcaption></figure>
    <figure><img src="../assets/panels/console-prof.webp" alt="触手职业">
      <figcaption>职业 · 21 种 · 编程首席</figcaption></figure>
  </div>
  <a class="cta" href="./console/index.html">进入认知界面</a>
  <div class="sign">开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属</div>
</main></body></html>
