  .caption { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%);

    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }

    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
