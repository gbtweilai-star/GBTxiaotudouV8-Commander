<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>本机权重 · 统一入口</title>
<style>body{margin:0;padding:16px;background:#0b0f16;color:#c9d4e2;font:13px/1.5 ui-monospace,Menlo,monospace}
pre{white-space:pre-wrap;background:#111827;padding:12px;border-radius:8px}.ok{color:#34d399}.bad{color:#ff8a8a}.dim{color:#64748b}</style>
</head><body><pre id="o">载入…</pre>
<script type="module">
import { createLocalLLM } from "./local-llm.js";
const L=[],out=document.getElementById("o"),say=(s)=>{L.push(s);out.innerHTML=L.join("\n");};
const q=new URLSearchParams(location.search);
const want=q.get("backend")||"auto";
(async()=>{
  try{
    const t0=performance.now();
    const llm=await createLocalLLM({backend:want});
    window.GBT_PAGE_LLM = llm;   /* worker 模式复用它，不另建引擎 */
    say(`统一入口就绪 · backend=<b>${llm.backend}</b> · 载入 ${(performance.now()-t0|0)} ms`);
    if(llm.note) say(`  <span class="dim">${llm.note}</span>`);
    say(`  模型 ${llm.model.arch} · ${llm.model.layers} 层 · emb ${llm.model.emb} · 头 ${llm.model.heads}/${llm.model.kvHeads} · 词表 ${llm.model.vocab}`);

    /* ① 金标准：同一条提示必须出 Paris */
    const t1=performance.now();
    const nx=await llm.nextToken("The capital of France is");
    const firstMs=performance.now()-t1;
    say(`  首 token ${firstMs|0} ms · top-1 = ${JSON.stringify(nx.text)}`);

    /* ② 对话 */
    const t2=performance.now();
    const c=await llm.chat("What is the capital of France?",16);
    say(`  chat → ${JSON.stringify(c.text)} · ${c.tokens} token · ${c.tokPerSec} tok/s`);
    const c2=await llm.chat("Name two colors.",16);
    say(`  chat → ${JSON.stringify(c2.text)} · ${c2.tokens} token · ${c2.tokPerSec} tok/s`);
    const tChat=(performance.now()-t2)/1000;

    const rows=[
      [`backend = ${llm.backend}${want!=="js"?"（auto 时应为 gpu）":"（显式指定）"}`, want==="js"? llm.backend==="js" : llm.backend==="gpu"],
      ["top-1 是 Paris（金标准）", /Paris/.test(nx.text)],
      /* 判据按后端分开：GPU 与 JS 是两条路，用同一个门槛既不公平也不专业。
         gpu 门槛 30（实测 ~38-42）；js 门槛 8（实测 ~8.9-9.8）。 */
      [`速度 ≥ ${llm.backend === "gpu" ? 30 : 8} tok/s（实测 ${c.tokPerSec}）`,
       (c.tokPerSec || 0) >= (llm.backend === "gpu" ? 30 : 8)],
      [`首 token ≤ 3000 ms（实测 ${firstMs|0}）`, firstMs<=3000],
      ["chat 出的是英文句子（不是乱码/不重复打转）", /[A-Za-z]{3,}/.test(c.text) && !/(\b\w+\b)(\s+\1){2,}/.test(c.text)],
    ];
    const bad=rows.filter(r=>!r[1]).length;
    say("");
    for(const [t,ok] of rows) say(ok?`<span class="ok">✅ ${t}</span>`:`<span class="bad">🔴 ${t}</span>`);
    say(bad===0?`<span class="ok">统一入口自检通过（${rows.length}/${rows.length}）</span>`:`<span class="bad">未达标：${bad} 项红</span>`);
    window.__llm={ok:bad===0,backend:llm.backend,note:llm.note,firstMs:firstMs|0,
                  tps:c.tokPerSec,top1:nx.text,chat:c.text,rows};
    /* 先证明"本页真能穿透到执行层"：调一次 health，把平台/python/耗时记进证据 */
    if (/[?&]_probe=1/.test(location.search) && window.gbtW3 && window.gbtW3.cap) {
      try {
        var tC = performance.now();
        var cr = await window.gbtW3.cap("health", {});
        window.__capEvidence = { cap_ok: !!(cr && cr.ok), cap_ms: Math.round(performance.now() - tC),
                                 cap_python: (cr && cr.result && cr.result.python) || null };
      } catch (e) { window.__capEvidence = { cap_ok: false, cap_err: String(e && e.message || e) }; }
    }
    /* 🔴 2026-10-30：带 ?_probe=1 时把读数自报给桥，巡检就能像读 /health 一样读本页 */
    if (/[?&]_probe=1/.test(location.search)) {
      try {
        await fetch((location.port === "8081" ? "http://127.0.0.1:8791" : "http://127.0.0.1:8791") + "/_probe", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ page: "wgpu/local-llm.html", ok: bad === 0,
            readings: Object.assign({ backend: llm.backend, tps: c.tokPerSec, top1: nx.text,
                                      first_ms: firstMs|0, rows_bad: bad }, window.__capEvidence || {}) })
        });
        say("<span class='dim'>已向桥自报读数（/_probe）</span>");
      } catch (e) { say("<span class='dim'>自报失败：" + (e && e.message || e) + "</span>"); }
    }
  }catch(e){
    say(`<span class="bad">🔴 ${String(e&&e.message||e)}</span>`);
    if(e&&e.stack) say(`<span class="dim">${String(e.stack).split("\n").slice(0,4).join("\n")}</span>`);
    window.__llm={ok:false,error:String(e&&e.message||e)};
  }
})();
</script>
<!-- 触手覆盖（page_tentacle.py 自动注入 · 顺序不能反：先 web 壳再 kit） -->
<script src="../shell/tentacle-bridge.js?v=20261029"></script>
<script src="../shell/tentacle-kit.js?v=20261029"></script>

<script type="module">
/* ── 工人模式（2026-10-30）──────────────────────────────────────────
   主人令：她需要什么接口，就把触手插座做成什么接口；权重完全融入触手。
   于是这里让**页面成为触手的服务端**：轮询桥 /_local/next 领活，
   用浏览器内 GPU 跑我们自己的权重，再把结果交回 /_local/result。
   好处：完全不依赖 LM Pocket 的 :1234 —— 权重在页里、算力在整机。 */
const WORKER = /[?&]_worker=1/.test(location.search);
if (WORKER) {
  (async function () {
    const BR = "http://127.0.0.1:8791";
    const el = document.getElementById("o");
    const log = (m) => { if (el) el.innerHTML += "\n<span style='color:#7dd3fc'>[worker]</span> " + m; };
    let llm = null;
    for (let i = 0; i < 60 && !llm; i++) {
      if (window.GBT_PAGE_LLM) { llm = window.GBT_PAGE_LLM; break; }
      await new Promise(r => setTimeout(r, 500));
    }
    if (!llm) {
      const mod = await import("./local-llm.js");
      llm = await mod.createLocalLLM({ backend: "auto", modelUrl: "models/tiny.gguf" });
    }
    log("就绪 · backend=" + llm.backend);
    const done = new Set();
    /* 长轮询循环：fetch 挂着等桥给活（后台标签也不会被节流打死）；拿不到就继续挂。 */
    (async function loop() {
      for (;;) {
        try {
          const r = await fetch(BR + "/_local/next?wait=25", { cache: "no-store" });
          const d = await r.json();
          if (d && d.job) { await handleJob(d.job); }
        } catch (e) { await new Promise(z => setTimeout(z, 1500)); }
      }
    })();

    /* 🔴 2026-10-30：原来这里是个内联 setInterval（后台标签被节流到几十秒一次），
       而长轮询循环调用的 handleJob **根本不存在** ⇒ 一直落 catch，工人从不干活。
       现在提取成具名函数，长轮询直接调它。 */
    async function handleJob(job) {
      if (!job || done.has(job.id)) return;
      done.add(job.id);
      log("领活 " + job.id + "：" + String(job.text).slice(0, 30));
      try {
        const out = await llm.chat(job.text, job.max_tokens || 48);
        await fetch(BR + "/_local/result", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: job.id, text: out.text, backend: llm.backend,
                                 tokPerSec: out.tokPerSec, tokens: out.tokens })
        });
        log("交回 " + job.id + "：" + String(out.text).slice(0, 40));
      } catch (e) {
        await fetch(BR + "/_local/result", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: job.id, text: "", backend: "err",
                                 tokPerSec: null, tokens: 0 })
        });
        log("失败 " + job.id + "：" + (e && e.message || e));
      }
    }
  })();
}
</script>

<script type="module">
/* 🔴 2026-10-30：工人模式改**独立自包含**（自己 import 引擎，不依赖页面内变量）。
   原因：之前写在页面闭包里，handleJob 引用的 llm 在作用域上拿不到，结果一直 err。
   长轮询（wait=25）而不是 setInterval —— 后台标签的定时器会被节流，fetch 回调不会。 */
window.__workerBoot = "module-loaded";
if (/[?&]_worker=1/.test(location.search)) {
  window.__workerLog = [];
  const push = (m) => { try { window.__workerLog.push(m); if (window.__workerLog.length > 40) window.__workerLog.shift(); } catch (e) {} };
  const BASE = (location.port === "8081") ? "http://127.0.0.1:8791" : "http://127.0.0.1:8791";
  const log = (m) => { push(m); try { console.log("[worker] " + m); } catch (e) {} };
  let llm = null, backoff = 500;
  async function ensureLLM() {
    if (llm) return llm;
    const mod = await import("./local-llm.js");
    llm = await mod.createLocalLLM({ backend: "auto", modelUrl: "models/tiny.gguf" });
    log("引擎就绪 backend=" + llm.backend);
    return llm;
  }
  const done = new Set();
  (async function loop() {
    for (;;) {
      try {
        await ensureLLM();
        const r = await fetch(BASE + "/_local/next?wait=25", { cache: "no-store" });
        const d = await r.json();
        const job = d && d.job;
        if (!job) { backoff = 500; continue; }
        if (done.has(job.id)) continue;
        done.add(job.id);
        log("领活 " + job.id);
        let payload = { id: job.id, text: "", backend: "err", tokPerSec: null, tokens: 0 };
        try {
          const out = await llm.chat(String(job.text || ""), job.max_tokens || 48);
          payload = { id: job.id, text: out.text, backend: llm.backend,
                      tokPerSec: out.tokPerSec, tokens: out.tokens };
        } catch (e) {
          payload.text = "";
          log("算失败 " + job.id + "：" + (e && e.message || e));
        }
        await fetch(BASE + "/_local/result", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        log("交回 " + job.id + "：" + String(payload.text).slice(0, 40));
      } catch (e) {
        await new Promise(z => setTimeout(z, backoff));
        backoff = Math.min(5000, backoff * 2);
      }
    }
  })();
}
</script>
</body></html>
