<script>
(function () {
 "use strict";
 var T = window.THREE;
 var $ = function (id) { return document.getElementById(id); };
 var STATE = { ok: false, why: "", bones: 0, selected: null, unweighted: null, hasSkin: false, meshes: 0, verts: 0 };

 function tag(id, text, ok) {
 var el = $(id); if (!el) return;
 el.textContent = text; el.setAttribute("data-ok", ok ? "1" : "0");
 }
 if (!T) { tag("tagStage", "引擎：没载入 three", false); $("bones").textContent = "three.global.js 不在或没挂上"; return; }
 if (!T.GLTFLoader) { tag("tagStage", "引擎：没 GLTFLoader", false); $("bones").textContent = "GLTFLoader.global.js 缺失"; return; }

 var canvas = $("gl");
 /* 软件渲染降级（2026-10-29 卡点根因修复）：
    本机 GPU 起不来、走 SwiftShader 软件渲染时，THREE 的 WebGLRenderer 创建 + requestAnimationFrame
    渲染循环会把渲染进程主线程占死（脚本调用永不返回、连心跳都发不出），
    连累一体式外壳的 iframe 切页（onepiece 逐页验实测：这页卡死后其余页全超时）。
    用临时 canvas 先探测 GPU 名（不建 THREE renderer —— renderer 创建本身就可能卡死），
    命中软件渲染则降级到静态图、不建 renderer、不跑渲染循环，明写原因（这是降级，不是失败）。 */
 var SOFT_GPU = false;
 (function softGpuFallback() {
   var name = "", soft = false;
   try {
     var probe = document.createElement("canvas");
     var gl = probe.getContext("webgl") || probe.getContext("experimental-webgl");
     if (!gl) { soft = true; name = "WebGL 拿不到"; }
     else {
       var ext = gl.getExtension("WEBGL_debug_renderer_info");
       name = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || "") : "";
       // 拿不到 debug 信息（ext 为 null / name 空）也当软件渲染：宁可降级，不许空转卡死
       // （真启动 visible 时曾返回拿不到 ext，3D 循环空转把 renderer 拖到 CPU 470s、点不动）
       if (!ext || !name) soft = true;
       else if (/swiftshader|llvmpipe|software|basic render|mesa/i.test(name)) soft = true;
     }
   } catch (e) { soft = true; name = "探测抛错"; }
   if (!soft) return;   // 真 GPU，继续 3D
   canvas.style.display = "none";
   var hero = document.createElement("img");
   hero.id = "gbt-dh-hero";
   hero.src = "digital-human-hero-front.jpg";
   hero.alt = "GBT 数字人（软件渲染降级静态图）";
   hero.style.cssText = "display:block;max-width:100%;max-height:100%;margin:0 auto;object-fit:contain;";
   canvas.parentNode.insertBefore(hero, canvas);
   tag("tagStage", "软件渲染降级：本机 GPU 不可用（" + name + "），3D 已换成静态图", true);
   $("bones").textContent = "3D 已降级（软件渲染 · " + name + "）";
   SOFT_GPU = true;
 })();
 if (SOFT_GPU) return;
 var renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
 renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
 if ("outputColorSpace" in renderer) renderer.outputColorSpace = T.SRGBColorSpace;
 renderer.toneMapping = T.ACESFilmicToneMapping;
 renderer.toneMappingExposure = 1.02;
 /* 兜底色与影棚背景同调：天空球万一没建起来，看到的也是灰底而不是黑洞。 */
 renderer.setClearColor(0x23262b, 1);

 var scene = new T.Scene();
 var camera = new T.PerspectiveCamera(35, 1, 0.05, 80);
 camera.position.set(1.6, 1.5, 3.2);

 var controls = (T.OrbitControls ? new T.OrbitControls(camera, renderer.domElement) : null);
 if (controls) { controls.target.set(0, 0.95, 0); controls.enableDamping = true; controls.dampingFactor = 0.08; }

 scene.add(new T.HemisphereLight(0xdfe6f0, 0x30343a, 1.35));
 var keyL = new T.DirectionalLight(0xfff4e8, 1.9); keyL.position.set(-2.2, 3.0, 2.4); scene.add(keyL);
 var rimL = new T.DirectionalLight(0xd6e6ff, 0.85); rimL.position.set(2.4, 2.2, -2.6); scene.add(rimL);
 var fillL = new T.DirectionalLight(0xeef4ff, 1.15); fillL.position.set(1.2, 1.0, 3.0); scene.add(fillL);

 /* ── 影棚化（2026-10-28 主人对标参考图后改）───────────────────────────────
    原来：setClearColor(0x05070d) 纯深蓝黑 + GridHelper 网格地面 + 青轮廓光。
          网格是"脚手架感"的最大来源 —— 一眼看出在建模软件里，不是拍照。
    参考图给的是「灰色影棚背景纸 + 脚下柔和投影 + 中性冷白轮廓」，所以换三样：
      ① 天空球（BackSide）贴径向渐变 —— 用球而不是平面，是因为这页有 OrbitControls，
         用户一转视角平面就露馅；球从任何角度看都是连续的背景纸。
      ② 脚下椭圆「伪投影」—— 不用 shadowMap：省性能、无锯齿，也不受硬件阴影贴图限制。
      ③ 网格删掉（变量一并去掉，留着会误导后人以为它还在场景里）。
    两处 toneMapped:false 是必须的 —— 否则 ACES 色调映射会把灰底压暗、把假投影提亮。 */
 (function studioBackdrop() {
   var cv = document.createElement("canvas");
   cv.width = cv.height = 512;
   var g = cv.getContext("2d");
   var rg = g.createRadialGradient(256, 208, 24, 256, 256, 344);
   rg.addColorStop(0, "#70757c");
   rg.addColorStop(0.45, "#4d5259");
   rg.addColorStop(0.78, "#34383e");
   rg.addColorStop(1, "#23262b");
   g.fillStyle = rg; g.fillRect(0, 0, 512, 512);
   var tex = new T.CanvasTexture(cv);
   if ("colorSpace" in tex) tex.colorSpace = T.SRGBColorSpace;
   var sky = new T.Mesh(
     new T.SphereGeometry(28, 32, 24),
     new T.MeshBasicMaterial({ map: tex, side: T.BackSide, depthWrite: false, toneMapped: false })
   );
   scene.add(sky);
 })();

 (function groundShadow() {
   var cv = document.createElement("canvas");
   cv.width = cv.height = 256;
   var g = cv.getContext("2d");
   var rg = g.createRadialGradient(128, 128, 6, 128, 128, 118);
   rg.addColorStop(0, "rgba(9,10,13,.58)");
   rg.addColorStop(0.45, "rgba(9,10,13,.24)");
   rg.addColorStop(1, "rgba(9,10,13,0)");
   g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
   var tex = new T.CanvasTexture(cv);
   if ("colorSpace" in tex) tex.colorSpace = T.SRGBColorSpace;
   var m = new T.Mesh(
     new T.PlaneGeometry(1.12, 0.76),
     new T.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0.95, toneMapped: false })
   );
   m.rotation.x = -Math.PI / 2;
   m.position.set(0, 0.002, 0.02);
   scene.add(m);
 })();

 /* ── 环境反射（2026-10-28）────────────────────────────────────────────────
    为什么必须做：这个模型是单材质、且本来没有 envMap ⇒ 黑金服装上的金色件是「死」的，
    不反射任何东西（只有方向光给的一点漫反射），皮肤暗部也没有环境光补充。
    做法：用 canvas 画一张影棚等距柱状环境（上亮下暗 + 左右两块柔光板），
    交给 PMREMGenerator 预卷积后赋给 scene.environment —— 不需要任何 HDR 文件，仍是零 CDN。
    天空球是 MeshBasicMaterial，不受 environment 影响，所以背景不会被二次照亮。 */
 (function studioEnv() {
   if (!T.PMREMGenerator) return;
   var cv = document.createElement("canvas");
   cv.width = 512; cv.height = 256;
   var g = cv.getContext("2d");
   var lg = g.createLinearGradient(0, 0, 0, 256);
   lg.addColorStop(0, "#dfe4ea");
   lg.addColorStop(0.46, "#9aa1a9");
   lg.addColorStop(0.54, "#4e5359");
   lg.addColorStop(1, "#24272b");
   g.fillStyle = lg; g.fillRect(0, 0, 512, 256);
   function softPanel(cx, cy, r, a) {
     var rg = g.createRadialGradient(cx, cy, 1, cx, cy, r);
     rg.addColorStop(0, "rgba(255,255,255," + a + ")");
     rg.addColorStop(1, "rgba(255,255,255,0)");
     g.fillStyle = rg;
     g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
   }
   softPanel(112, 66, 104, 0.88);      /* 左柔光板（主光那一侧的反射） */
   softPanel(398, 74, 96, 0.62);       /* 右柔光板（弱一档，制造左右差） */
   var tex = new T.CanvasTexture(cv);
   tex.mapping = T.EquirectangularReflectionMapping;
   if ("colorSpace" in tex) tex.colorSpace = T.SRGBColorSpace;
   var pmrem = new T.PMREMGenerator(renderer);
   pmrem.compileEquirectangularShader();
   scene.environment = pmrem.fromEquirectangular(tex).texture;
   tex.dispose();
   pmrem.dispose();
 })();

 var bones = {}; /* name → Bone（含 sanitize 后的名） */
 var boneOrder = []; /* 遍历顺序（去重），骨骼树按它排 */
 var boneList = []; /* 展示顺序 */
 var weightCount = {}; /* skin.joints 下标 → 真绑到的顶点数 */
 var model = null, mixer = null, skeletonHelper = null, wireOn = false;

 function boneKey(n) { return String(n || "").replace(/[^\w\-]/g, ""); }

 function onGltf(gltf) {
 model = gltf.scene || (gltf.scenes && gltf.scenes[0]);
 if (!model) { tag("tagStage", "引擎：GLB 无场景", false); return; }

 var box = new T.Box3().setFromObject(model), size = new T.Vector3(); box.getSize(size);
 if (isFinite(size.y) && size.y> 0) {
 var k = 1.72 / size.y; model.scale.multiplyScalar(k);
 box.setFromObject(model);
 var c = new T.Vector3(); box.getCenter(c);
 model.position.x -= c.x; model.position.z -= c.z; model.position.y -= box.min.y;
 }

 /* 材质：单材质模型默认 envMapIntensity=1，在灰环境里几乎看不出反射 ——
    提到 0.9 并显式标 needsUpdate，让上面那张环境贴图真的参与到金属件的高光里。 */
 model.traverse(function (o) {
   if (!o.isMesh || !o.material) return;
   var mats = Array.isArray(o.material) ? o.material : [o.material];
   mats.forEach(function (m) {
     if ("envMapIntensity" in m) m.envMapIntensity = 0.9;
     m.needsUpdate = true;
   });
 });

 /* AO 遮蔽：Blender 4.2 Cycles 对同一个 glb 烘的一张灰度图（不动 glb，避免往返破坏
    skinning/动画）。作用：缝隙、褶皱、夹克层叠处暗下去 —— 照片感有很大一部分来自这个，
    只靠灯光打不出来。
    注意三个必须：
       · uv2 要「同步」克隆（几何已就绪，不用等图片）——aoMap 采样的是 uv2，这套 glb 只有 uv；
       · flipY = false（glTF 的 UV 原点在左上，Three 的 Texture 默认按左下）；
       · colorSpace = NoColorSpace（AO 是数据不是颜色，按 sRGB 解码会整体偏亮）。 */
 model.traverse(function (o) {
   if (!o.isMesh || !o.geometry) return;
   var g = o.geometry;
   if (!g.attributes.uv2 && g.attributes.uv) g.setAttribute("uv2", g.attributes.uv);
 });

 (function applyAO() {
   var ao = window.GBT_DH_AO;
   if (!ao || !ao.dataURI) { tag("tagStage", "引擎：three · glTF2 · AO 未内联（跳过）", false); return; }
   var img = new Image();
   img.onload = function () {
     var tex = new T.Texture(img);
     tex.flipY = false;
     if ("colorSpace" in tex) tex.colorSpace = T.NoColorSpace;
     tex.needsUpdate = true;
     model.traverse(function (o) {
       if (!o.isMesh || !o.material) return;
       var mats = Array.isArray(o.material) ? o.material : [o.material];
       mats.forEach(function (m) {
         m.aoMap = tex;
         m.aoMapIntensity = 0.88;
         m.needsUpdate = true;
       });
     });
   };
   img.onerror = function () { tag("tagStage", "引擎：three · AO 贴图解码失败", false); };
   img.src = ao.dataURI;
 })();

 model.traverse(function (o) {
 if (o.isMesh) {
 STATE.meshes += 1;
 var geo = o.geometry;
 if (geo && geo.attributes && geo.attributes.position) {
 STATE.verts += geo.attributes.position.count;
 if (geo.attributes.skinIndex && geo.attributes.skinWeight) {
 /* 有蒙皮数据 ⇒ 计数从 0 起（"一个都没发现"不等于"没有这个字段"：
 原来只在真发现未绑顶点时才从 null 变数字，于是 0 个未绑顶点被念成"无 skin 数据"）。 */
 if (!STATE.hasSkin) { STATE.hasSkin = true; STATE.unweighted = 0; }
 var si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
 for (var v = 0; v< si.count; v++) {
 var total = 0;
 for (var j = 0; j< 4; j++) {
 var w = sw.getComponent(v, j);
 total += w;
 if (w> 0.001) {
 var bi = si.getComponent(v, j);
 weightCount[bi] = (weightCount[bi] || 0) + 1;
 }
 }
 if (total< 0.02) { STATE.unweighted += 1; }
 }
 }
 }
 o.frustumCulled = false;
 }
 if (o.isBone) {
 bones[o.name] = o;
 bones[boneKey(o.name)] = o;
 if (boneOrder.indexOf(o)< 0) boneOrder.push(o);
 }
 });

 scene.add(model);
 /* 名字口径（2026-10-19 修）：GLTFLoader 会把节点名 sanitize 成 `mixamorigLeftUpLeg`（冒号被去掉），
 原来这里按 `mixamorig:` 前缀筛，于是一根骨头都筛不到 —— 顶上写着"骨骼 0 根"、骨骼树空、
 姿态滑杆全废，而模型看着好好的（本仓 P1 那一族的变种：判据盯的名字跟引擎给的名字不是一个）。
 ⇒ 按 /^mixamorig:?/ 两种写法都认；展示时把前缀剥掉。 */
 boneList = boneOrder.filter(function (b) {
 return /^mixamorig:?/.test(String(b.name));
 }).map(function (b) { return b.name; });
 STATE.bones = boneList.length;
 STATE.ok = true;

 tag("tagStage", "引擎：three " + (T.REVISION || "?") + " · glTF2", true);
 tag("tagBones", "骨骼：" + STATE.bones + " 根", STATE.bones> 0);
 var wtText = !STATE.hasSkin ? "权重：无 skin 数据"
 : ("权重：未绑顶点 " + STATE.unweighted + " / " + STATE.verts);
 tag("tagWt", wtText, STATE.hasSkin && STATE.unweighted === 0);

 drawBones();
 audit(gltf);

 if (gltf.animations && gltf.animations.length && T.AnimationMixer) {
 mixer = new T.AnimationMixer(model);
 gltf.animations.forEach(function (clip) {
 if (/idle/i.test(clip.name)) { mixer.clipAction(clip).play(); }
 });
 }
 if (controls) { controls.target.set(0, 0.95, 0); controls.update(); }
 }

 /* 骨名 → skin.joints 下标（权重按关节下标统计） */
 function findSkinIndexOf(bone) {
 var found = -1;
 if (!model) return found;
 model.traverse(function (o) {
 if (o.isSkinnedMesh && o.skeleton && found< 0) {
 for (var i = 0; i< o.skeleton.bones.length; i++) {
 if (o.skeleton.bones[i] === bone) { found = i; break; }
 }
 }
 });
 return found;
 }

 function drawBones() {
 var host = $("bones");
 host.textContent = "";
 boneList.forEach(function (name) {
 var b = bones[name];
 var idx = b ? findSkinIndexOf(b) : -1;
 var n = idx>= 0 ? (weightCount[idx] || 0) : 0;
 var row = document.createElement("div");
 row.className = "bone";
 row.setAttribute("data-bone", name);
 row.innerHTML = '<span class="dot"></span><span>' + String(name).replace(/^mixamorig:?/, "") +
 '</span><span class="wt">' + (n ? n + " 顶点" : "—") + "</span>";
 row.addEventListener("click", function () { selectBone(name); });
 host.appendChild(row);
 });
 }

 function selectBone(name) {
 STATE.selected = name;
 var rows = document.querySelectorAll(".bone");
 for (var i = 0; i< rows.length; i++) {
 rows[i].setAttribute("data-sel", rows[i].getAttribute("data-bone") === name ? "1" : "0");
 }
 var b = bones[name];
 if (!b) return;
 $("rx").value = Math.round(T.MathUtils.radToDeg(b.rotation.x));
 $("ry").value = Math.round(T.MathUtils.radToDeg(b.rotation.y));
 $("rz").value = Math.round(T.MathUtils.radToDeg(b.rotation.z));
 syncOut();
 $("footMsg").textContent = "已选：" + name + "（拖滑块 = 真改这根骨的旋转）";
 }

 function syncOut() {
 $("ox").textContent = $("rx").value;
 $("oy").textContent = $("ry").value;
 $("oz").textContent = $("rz").value;
 }

 function applyPose() {
 var name = STATE.selected; if (!name) return;
 var b = bones[name]; if (!b) return;
 b.rotation.x = T.MathUtils.degToRad(Number($("rx").value));
 b.rotation.y = T.MathUtils.degToRad(Number($("ry").value));
 b.rotation.z = T.MathUtils.degToRad(Number($("rz").value));
 }
 ["rx", "ry", "rz"].forEach(function (id) {
 $(id).addEventListener("input", function () { syncOut(); applyPose(); });
 });

 function audit(gltf) {
 var lines = [];
 lines.push("网格<b>" + STATE.meshes + "</b> · 顶点<b>" + STATE.verts + "</b>");
 lines.push("骨骼<b>" + STATE.bones + "</b> · 动作 " + ((gltf.animations || []).length
 ? gltf.animations.map(function (c) { return c.name + "(" + c.duration.toFixed(2) + "s)"; }).join(" / ")
 : "无"));
 var box = new T.Box3().setFromObject(model), s = new T.Vector3(); box.getSize(s);
 lines.push("绑定姿势包围盒 高<b>" + s.y.toFixed(2) + "m</b> · 宽 " + s.x.toFixed(2) + " · 厚 " + s.z.toFixed(2)
 + "（量的是 T-pose：臂展张开时宽 1.67，不是她站着时的宽）");
 lines.push("口型骨<b>" + (/Jaw/i.test(boneList.join(",")) ? "有" : "无（本资产无 jaw / 无形态键）") + "</b>");
 lines.push("真绑到的关节<b>" + Object.keys(weightCount).length + "</b> / " + STATE.bones);
 if (STATE.hasSkin) {
 lines.push("未绑顶点<b>" + STATE.unweighted + "</b>（占 " +
 (100 * STATE.unweighted / Math.max(1, STATE.verts)).toFixed(1) + "%）");
 } else {
 lines.push("未绑顶点：<b>无 skin 数据</b>（不是 0 —— 是没这个字段）");
 }
 /* 来源必须指到真读的那一份，并且自证：把真被解析的字节的 sha16/字节数/取法打在页上。
 这样别人看到"骨骼 0 根"时，一眼能判出：是资产不对（sha16 不等于在役件）、还是窗口过期。 */
 lines.push("来源<b>holo_pet_w3/voice-theater/assets/dh-v2-rigged.glb</b>"
 + (LOADED.via ? " · 经<b>" + LOADED.via + "</b>" : "")
 + (LOADED.bytes ? " · " + LOADED.bytes + " 字节" : "")
 + (LOADED.sha16 ? " · sha16<b>" + LOADED.sha16 + "</b>" : " · sha16 未取到（浏览器没给 subtle）"));
 if (LOADED.sha16 && LOADED.sha16 !== WANT_SHA16) {
 /* 2026-10-26：去掉 记号（审美守卫判 emoji 当 UI）—— 状态用词 +<b> 表达。 */
 lines.push("<b>载入的不是在役件</b>（在役 " + WANT_SHA16 + "）—— 这一页的全部读数不作数，先查资产再谈绑骨");
 }
 var B = window.GBT_RIG_AUDIT;
 if (B && B.ok) {
 lines.push(""); lines.push("<b>Blender 量具（--background，只读）</b>");
 lines.push("骨架 " + B.armatures + " · 骨骼 " + B.bones + " · 根骨 " + (B.roots || []).join(",") + " · 最大层级 " + B.max_depth);
 lines.push("未绑顶点<b>" + B.unweighted + "（" + B.unweighted_pct + "%）</b> · 非归一化 " + B.non_normalized + " · 真绑组 " + B.bound_groups);
 lines.push("镜像<b>" + B.mirror_ok + "/" + B.mirror_pairs + "</b> 对 · 零长骨 " + ((B.zero_len || []).length || "无"));
 lines.push("高<b>" + B.height_m + "m</b> · 未应用缩放 " + ((B.unapplied_scale || []).length || "无"));
 lines.push("量于 " + String(B.at || "?").replace("T", " ").slice(0, 19));
 } else if (B && B.ok === false) {
 lines.push(""); lines.push("<b>Blender 量具</b>：<b>未通过</b> —— " + String(B.why || "未读到最后一次审计"));
 }
 $("audit").textContent = "";
 $("audit").appendChild(document.createTextNode(""));
 $("audit").innerHTML = lines.join("<br />");
 }

 $("btnWire").addEventListener("click", function () {
 wireOn = !wireOn;
 if (wireOn && !skeletonHelper && T.SkeletonHelper && model) {
 skeletonHelper = new T.SkeletonHelper(model); scene.add(skeletonHelper);
 }
 if (skeletonHelper) skeletonHelper.visible = wireOn;
 /* 不糊弄：没有骨架就别写"已显示真骨骼"——那一刻最该说的是"先查载入件"。 */
 $("footMsg").textContent = wireOn
 ? (boneList.length ? "骨架已显示（SkeletonHelper · " + boneList.length + " 根真骨）"
 : "没有骨架可显示：先查右侧「来源」的 sha16 是不是在役件")
 : "骨架已隐藏";
 });

 $("btnReset").addEventListener("click", function () {
 ["rx", "ry", "rz"].forEach(function (id) { $(id).value = 0; });
 syncOut(); applyPose();
 $("footMsg").textContent = "已把选中的骨复位到 0°";
 });

 $("btnPose").addEventListener("click", function () {
 var pose = {};
 boneList.forEach(function (n) {
 var b = bones[n]; if (!b) return;
 pose[n] = [+b.rotation.x.toFixed(4), +b.rotation.y.toFixed(4), +b.rotation.z.toFixed(4)];
 });
 $("poseOut").value = JSON.stringify({ at: new Date().toISOString(), bones: pose }, null, 1);
 $("footMsg").textContent = "姿态 JSON 已生成（" + boneList.length + " 根骨）· 复制走即可";
 });

 function resize() {
 var w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
 renderer.setSize(w, h, false);
 camera.aspect = w / h; camera.updateProjectionMatrix();
 }
 window.addEventListener("resize", resize);

 function tick() {
 if (mixer) mixer.update(0.016);
 if (controls) controls.update();
 renderer.render(scene, camera);
 requestAnimationFrame(tick);
 }

 var loader = new T.GLTFLoader();
 var ASSET = "../voice-theater/assets/dh-v2-rigged.glb";
 var WANT_SHA16 = "96114e1cc8b85e99"; /* 在役件指纹（= outputs/rig-fix/fixed-animfix.glb） */
 var LOADED = { via: "", bytes: 0, sha16: "" };

 /* 自证：本页显示的一切读数，必须能指回真被解析的那份字节。
 所以先把字节拿全（fetch → 退回 .b64.js），量它的 sha16/字节数，再交给 GLTFLoader。
 原来直接把 URL 丢给 loader.load：拿哪份、多少字节、是不是在役件，页面上一个字都没有 ——
 别人看到"骨骼 0 根"根本判不出是资产问题还是窗口过期。 */
 function sha16Of(buf) {
 if (!(window.crypto && crypto.subtle)) return Promise.resolve("");
 return crypto.subtle.digest("SHA-256", buf).then(function (d) {
 var b = new Uint8Array(d), s = "";
 for (var i = 0; i< 8; i++) s += ("0" + b[i].toString(16)).slice(-2);
 return s;
 }).catch(function () { return ""; });
 }

 function parseBytes(buf, via) {
 sha16Of(buf).then(function (h) {
 LOADED.via = via; LOADED.bytes = buf.byteLength; LOADED.sha16 = h;
 loader.parse(buf, "", function (g) { onGltf(g); audit(g); },
 function (e) {
 tag("tagStage", "解析失败：" + String((e && e.message) || e).slice(0, 40), false);
 });
 });
 }

 function loadInline() {
 var s = document.createElement("script");
 s.src = "../voice-theater/assets/dh-v2-rigged.glb.b64.js";
 s.onload = function () {
 if (!window.GBT_GLB_B64) { tag("tagStage", "载入失败：内联副本无载荷", false); return; }
 try {
 var raw = atob(window.GBT_GLB_B64), u8 = new Uint8Array(raw.length);
 for (var i = 0; i< raw.length; i++) u8[i] = raw.charCodeAt(i);
 parseBytes(u8.buffer, "inline(.b64.js)");
 } catch (e) { tag("tagStage", "载入异常：" + String(e.message || e).slice(0, 40), false); }
 };
 s.onerror = function () { tag("tagStage", "载入失败：取不到模型/内联副本", false); };
 document.head.appendChild(s);
 }

 if (typeof fetch === "function") {
 fetch(ASSET).then(function (r) {
 if (!r.ok) throw new Error("HTTP " + r.status);
 return r.arrayBuffer();
 }).then(function (b) { parseBytes(b, "fetch"); }).catch(function () { loadInline(); });
 } else {
 loadInline();
 }

 resize();
 tag("tagStage", "引擎：three " + (T.REVISION || "?") + " · 模型载入中…", true);
 requestAnimationFrame(tick);

 window.GBT_RIG = { state: function () { return STATE; }, select: selectBone };
})();
</script>

<script>
(function(){
 if (window.__gbtDefense) return; window.__gbtDefense = 3;
 var RULES = [
 ["提示词注入", /(ignore|disregard|forget)\s+(all\s+)?(previous|prior|above)\s+(instructions?|prompts?)/i],
 ["中文越狱", /(忽略|无视|忘记)(掉)?(之前|以上|前面|所有)(的)?(指令|提示|规则|要求)/],
 ["套系统提示", /(system\s*prompt|系统提示词|开发者消息|developer\s*message|你的设定原文|把你的规则贴出来)/i],
 ["套密钥", /(api[_\s-]?key|secret|token|密码|密钥|凭据).{0,12}(给我|发给我|贴出来|打印|显示|明文|show|print|reveal)/i],
 ["破门指令", /(rm\s+-rf|format\s+[a-z]:|del\s+\/f|drop\s+table|truncate\s+table|shutdown\s+\/s)/i],
 ["数据外带", /(curl\s+https?:\/\/|wget\s+https?:\/\/|upload|exfil|发送到|上传到).{0,40}(jsonl|审计|store|secrets?|dpapi|密钥)/i],
 ["远控接管", /(执行这条命令|run\s+this\s+command|反向\s*shell|reverse\s*shell|监听端口|bind\s+shell)/i]
 ];
 function check(text){ var t=String(text||""); for(var i=0;i<RULES.length;i++){ if(RULES[i][1].test(t)) return {rule:RULES[i][0],hit:(t.match(RULES[i][1])||[""])[0].slice(0,60)}; } return null; }
 function log(rec){
 try{ var b=JSON.parse(localStorage.getItem("gbt_defense_log")||"[]"); b.push(rec); if(b.length>50) b=b.slice(-50);
 localStorage.setItem("gbt_defense_log", JSON.stringify(b)); }catch(e){}
 }
 function bar(msg, tone){
 var d=document.getElementById("gbt-defense-bar");
 if(!d){ d=document.createElement("div"); d.id="gbt-defense-bar";
 d.style.cssText="position:fixed;left:8px;right:8px;bottom:74px;z-index:99998;font:13px/1.6 system-ui;border-radius:12px;padding:8px 10px;display:none;"; document.body.appendChild(d); }
 d.textContent=msg; d.style.display="block";
 d.style.background=(tone==="hit")?"rgba(120,20,20,.94)":"rgba(17,24,39,.94)";
 d.style.color="#E8ECF8"; d.style.border="1px solid "+(tone==="hit")?"#f5b041":"#00e5ff";
 }
 function baseUrl(){
 var b = window.GBT_FRAMEWORK_URL || "";
 if(!b){ try{ b = localStorage.getItem("gbt_framework_url") || ""; }catch(e){} }
 if(!b && /^https?:$/.test(location.protocol)){ b = location.protocol + "//" + location.hostname + ":8877"; }
 return b;
 }
 function report(rec){
 var base = baseUrl();
 if(!base){ log(rec); rec._status="未联网（离线仅拦截+留证，反控需框架在线）"; return Promise.resolve(rec); }
 log(rec);
 try{
 return fetch(base.replace(/\/$/,"")+"/defense/report",{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify(rec)}).then(function(r){ rec._status="已上报框架 HTTP "+r.status; return rec; })
 .catch(function(e){ rec._status="上报失败："+String(e).slice(0,80); return rec; });
 }catch(e){ rec._status="上报异常："+String(e).slice(0,80); return rec; }
 }
 function speak(t){ /* 2026-10-18 主人令：不许用 zh-CN SAPI 出声（主人原话：「还有其他声音参入」）。
 这一行原来是 `new SpeechSynthesisUtterance; u.lang="zh-CN"; speak(u)` —— 每次误报都会用大陆腔机器音
 念一句「检测到攻击，已拦截」，和她的台湾腔神经嗓叠在一起，听起来就是"好几个声音在说话"。
 仓规：拿不到台湾腔就不出声，不用大陆腔顶替 ⇒ 现在只留视觉红条 + 控制台留痕；
 要真出声只能走能力位 `voice op=speak`（单一门）。 */
 try{ if(String(t)) console.info("[自卫] "+t+"（不发声：不用 zh-CN SAPI）"); }catch(e){} }
 function block(el, why){
 var rec={ts:new Date().toISOString(),url:location.href,rule:why.rule,hit:why.hit,
 where:(el&&(el.tagName||""))||"page-text"};
 bar("已拦截：疑似「"+why.rule+"」（"+why.hit+"）· 证据已留本地","hit"); speak("检测到攻击，已拦截");
 report(rec).then(function(){ bar("已拦截「"+why.rule+"」· "+((rec&&rec._status)||""),"hit"); });
 return true;
 }
 // ① 拦输入/粘贴
 function guardInputs(){
 var els=document.querySelectorAll("input,textarea,[contenteditable=true]");
 for(var i=0;i<els.length;i++){(function(el){
 el.addEventListener("paste",function(e){ var t=(e.clipboardData||window.clipboardData).getData("text"); var w=check(t);
 if(w){ e.preventDefault(); block(el,w); } });
 el.addEventListener("input",function(){ var w=check(el.value); if(w){ el.dataset.gbtBlocked="1";
 bar("该输入含攻击特征「"+w.rule+"」，已标记拦截 · 证据留本地","hit"); log({ts:new Date().toISOString(),url:location.href,rule:w.rule,hit:w.hit,where:"input-live"}); } });
 var f=el.form; if(f && !f.__gbtGuard){ f.__gbtGuard=1; f.addEventListener("submit",function(e){ var w=check(el.value);
 if(w){ e.preventDefault(); block(el,w); } }); }
 })(els[i]);}
 }
 // ② 扫页面可见文本（攻击内容被注入到页面时）
 /* 2026-10-18 修（主人投诉「还有其他声音参入」时挖到的真因）：
 原来这里对页面自己的静态正文跑 `block()` —— 于是像 digital-human 这种正文里写着
 「密钥 / 明文 / 凭证」字样的页面，一打开就自己报一次"已拦截「套密钥」"，
 还会念一句。这不是在拦攻击，是在拿自己的说明书当攻击。

 function scanPage(){
 var t=(document.body&&document.body.innerText||"").slice(0,20000); var w=check(t);
 if(w){ log({ts:new Date().toISOString(),url:location.href,rule:w.rule,hit:w.hit,where:"page-text(仅留证)"}); }
 }
 // ③ 自卫条：显示状态 + 证据导出 + 反控说明
 function panel(){
 guardInputs();
 var d=document.createElement("div"); d.id="gbt-defense-pill";

 d.style.cssText="position:fixed;right:10px;bottom:124px;z-index:99999;background:rgba(7,10,26,.92);color:#9AA4C4;border:1px solid rgba(0,229,255,.35);border-radius:12px;padding:6px 10px;font:12px/1.5 system-ui;cursor:pointer";
 d.textContent="自卫：开"; d.title="点击查看拦截记录";
 d.onclick=function(){ var b=[]; try{b=JSON.parse(localStorage.getItem("gbt_defense_log")||"[]");}catch(e){}
 alert("拦截记录 "+b.length+" 条\n"+(b.slice(-5).map(function(x){return x.ts+" ["+x.rule+"] "+x.hit;}).join("\n")||"暂无")+
 "\n\n反控链：框架在线 ⇒ sec_defenses 验证 → omni_plug ai_control 反向操控攻击AI（未在线则不假装已反控）"); };
 document.body.appendChild(d);
 }
 document.addEventListener("DOMContentLoaded", function(){ panel(); scanPage(); });
 if (document.body && document.readyState!=="loading") { panel(); scanPage(); }
})();
