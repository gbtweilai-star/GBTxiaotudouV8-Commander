<script>

    const w = document.getElementById('why'), i = document.getElementById('wid');
    const why = q.get('why'); if (why) w.textContent = why;
    const id = q.get('id'); if (id) i.textContent = id;
  } catch (e) { /* 拒绝页自己不因参数出错而崩 */ }
</script>
