<meta charset="utf-8" />
<title>GBT小土豆V8 · 对话</title>
<!-- 皮肤：只引壳的 token（window.css / deck3d.css 的 :root）。零裸色值。 -->
<link rel="stylesheet" href="../window.css" />
<link rel="stylesheet" href="../deck3d.css" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--gbt-deep); color: var(--gbt-text);
         font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
         display: flex; flex-direction: column; }
  /* ① 我们的品牌头条 —— 她在下面跑，但门面是我们的 */
  header.brand {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--gbt-line);
    /* 2026-10-26：原为 linear-gradient(180deg, var(--gbt-deep-2), var(--gbt-deep)) —— 两档。
       换成纯明度一档 --gbt-deep-2：品牌头条本来就该比正文区亮一档，不需要渐变来"过渡"。
       （审美守卫 gradient 命中 -1；层次仍在，只是不再靠渐变。） */
    background: var(--gbt-deep-2);
  }
  .logo { width: 26px; height: 26px; flex: 0 0 auto; }
  .who { font-size: 15px; letter-spacing: .02em; }
  .who b { color: var(--gbt-gold); }
  .sub { color: var(--gbt-dim); font-size: 12px; margin-left: 2px; }
  .spacer { flex: 1 1 auto; }
  .pill { border: 1px solid var(--gbt-edge); border-radius: 999px; padding: 3px 10px;
          font-size: 12px; color: var(--gbt-dim); }
  .pill.ok { color: var(--gbt-ok); border-color: var(--gbt-ok); }
  .pill.wait { color: var(--gbt-warn); border-color: var(--gbt-warn); }
  .pill.bad { color: var(--gbt-fault); border-color: var(--gbt-fault); }
  /* ② 她的引擎：内层 webview（token 由主进程在请求头里带，不进本页 JS） */
  #host { flex: 1 1 auto; position: relative; background: var(--gbt-deep); }
  #dsh { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  #dsh.on { display: block; }
  .wait-note { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; color: var(--gbt-dim); font-size: 13px;
               text-align: center; padding: 24px; }
</style>
<link rel="stylesheet" href="../page-skins.css" />
</head>
<body>
<script src="../shell/nav-compact.js"></script>
















































<header class="brand">
  <!-- 统一 Logo：GBT 星环（内联 SVG，零外部资源 —— 壳里不许引 CDN） -->
  <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="GBT小土豆">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#f5b041"/>
    </linearGradient></defs>
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#g)" stroke-width="4"/>
    <circle cx="32" cy="32" r="9" fill="url(#g)"/>
    <circle cx="32" cy="6" r="4" fill="#38bdf8"/>
  </svg>
  <span class="who">GBT<b>小土豆</b>V8</span>
  <span class="sub">· 对话（引擎在内运行）</span>
  <span class="spacer"></span>
  <span class="pill wait" id="state">正在接入…</span>
</header>
<div id="host">
  <webview id="dsh" partition="persist:gbt-dsh"></webview>
  <div class="wait-note" id="note">正把对话引擎接进来……接上后界面显示在这里，<b>门面仍是我们</b>。</div>
</div>
<script>
(function () {
  var st = document.getElementById("state");
  var note = document.getElementById("note");
  var wv = document.getElementById("dsh");
  function say(cls, text) { st.className = "pill " + cls; st.textContent = text; }

  /*  2026-10-26：本页从不接触带 token 的入口 URL。
     原来是壳用脚本注入把 URL 推进来、本页 setAttribute("src", url) ——
     同时踩两条纪律：B4（壳往别的窗注入脚本）、B7（带 token 的 URL 不许回显）。
     现在：本页只负责"让 webview 挂上 + 说一声我准备好了"，
     由主进程把入口 URL 直接 loadURL 进这个 webview —— URL 只在主进程内存。

      两个"看着能跑其实不跑"的坑，本轮都修了：
       ① 先 setAttribute("src") 后挂监听 ⇒ attach 极快的机器会错过事件
          （顺序必须：先挂监听 → 再设 src）；
       ② `if (!mount()) setInterval(...)` ⇒ mount 恒返回 true，条件永不成立
          ⇒ 重试从来没启动过。改成无条件起定时器，靠 inflight/mounted 挡重复。

      诚实性：`r.ok` 只代表主进程受理了 loadURL，不代表页面真加载成功。
        若 DSH 回 401，webview 里是 401 页，状态却说"已接入"= 假绿。
        ⇒ "受理"只说"正在接入"，真接上由 webview 的 did-finish-load 说；
          did-fail-load 如实报错误码。 */
  var api = window.gbtW3 || {};
  var inflight = false;    // 请求在飞
  var mounted = false;     // 主进程已受理（已发 loadURL）
  var ok = false;          // webview 真的加载完 —— 这才是"接上"
  var firstTimer = null, retryTimer = null;

  function stopRetry() {
    if (firstTimer) { clearTimeout(firstTimer); firstTimer = null; }
    if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
  }

  function mount() {
    if (inflight || mounted) return true;
    var wcId = 0;
    try { wcId = wv.getWebContentsId(); } catch (e) { wcId = 0; }
    /* 拿不到 wcId 不等于装不了：照发（0 = "你自己找"），主进程会凭 hostWebContents
       反查它名下的 guest。这种 Electron 版本差异不该让页面去猜。 */
    inflight = true;
    Promise.resolve(api.dshMount({ wcId: wcId })).then(function (r) {
      inflight = false;
      if (r && r.ok) {
        mounted = true;
        stopRetry();               // 受理了就停重试，别让定时器空跑到天荒地老
        say("wait", "正在接入" + (r.how ? "（" + r.how + "）" : "") + "…");
      } else {
        var why = (r && (r.error || r.reason)) || "";
        say("wait", "等壳把引擎拉起来…" + (why ? "（" + why + "）" : ""));
      }
    }).catch(function (e) {
      inflight = false;
      say("wait", "等壳把引擎拉起来…（" + ((e && e.message) || "调用失败") + "）");
    });
    return true;
  }

  /* 真加载完才算"页面进来了" —— 但注意：HTTP 401 也算加载完成
     （DSH 的 401 是它自己返回的错误页，会正常触发 did-finish-load）。
     所以这里不敢说"接入成功"，只说"已加载"，并把 401 的可能明写在提示区 ——
     主人看到的是 webview 里的真实内容 + 一句怎么修，而不是一句乐观的绿字。 */
  wv.addEventListener("did-finish-load", function () {
    if (!mounted) return;
    var u = "";
    try { u = wv.getURL() || ""; } catch (e) { u = ""; }
    if (!u || u === "about:blank") return;    // 我们自己的占位页，不算
    ok = true;
    wv.classList.add("on");
    note.style.display = "";
    note.innerHTML = "引擎已载入。若这里显示 <b>401 authentication required</b>，" +
      "说明入口 URL 没带 token —— 回「接对话面」页重新粘贴 <code>dsh web</code> " +
      "打印的完整 URL（含 <code>?token=</code> 那段）。";
    say("ok", "已载入 · 若界面是 401 请见下方提示");
  });

  /* 加载失败如实报（-3 = 被后续导航打断，属正常，不报）。 */
  wv.addEventListener("did-fail-load", function (ev) {
    if (!mounted || ok) return;
    var code = ev && ev.errorCode;
    if (code === -3) return;
    say("bad", "引擎加载失败：" +
      ((ev && ev.errorDescription) || ("错误码 " + code)) +
      "（地址 " + ((ev && ev.validatedURL) || "?") + "）");
  });

  if (typeof api.dshMount === "function") {
    /* 先挂监听、再设 src（顺序不能反）。 */
    wv.addEventListener("dom-ready", mount);
    wv.addEventListener("did-attach", mount);
    wv.setAttribute("src", "about:blank");   // 让 webview 先 attach（主进程靠它反查 guest）
    /* 兜底：事件万一没来，1s 后主动试一次，之后每 3s 一次；
       受理成功即 stopRetry()，失败则继续（壳拉起 dsh web 需要时间）。 */
    firstTimer = setTimeout(mount, 1000);
    retryTimer = setInterval(mount, 3000);
  } else {
    say("wait", "壳动作口没加载 —— 请从托盘菜单开「对话」窗");
  }
})();
</script>
<script src="tentacle-kit.js" defer></script>
</body>
</html>
