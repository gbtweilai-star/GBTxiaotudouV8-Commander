<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpaceBeam Lite v3</title>
<style>
 html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#eee;
   font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif}
 #c{position:fixed;inset:0;width:100%;height:100%}
 #ui{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;z-index:8;
     background:linear-gradient(rgba(0,0,0,.65),transparent);flex-wrap:wrap;
     transition:opacity .25s;opacity:0;pointer-events:none}
 body.ui #ui{opacity:1;pointer-events:auto}
 #ui button{font:inherit;font-size:13px;background:#1b1f26;color:#e9eef7;border:1px solid #2a3140;
     border-radius:9px;padding:5px 10px}
 #ui button.on{background:#c8452d;border-color:#c8452d}
 #msg{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;font-size:12px;
      background:rgba(0,0,0,.7);color:#ffd9a0;text-align:center;z-index:9}
</style></head><body>
<canvas id="c"></canvas>
<div id="msg">初始化…</div>
<div id="ui">
  <button data-seg="2">2 段</button><button data-seg="3">3 段</button>
  <button data-seg="4" class="on">4 段</button><button data-seg="6">6 段</button>
  <button data-seg="8">8 段</button>
  <button data-preset="slow">慢旋</button>
  <button data-preset="tight">特写</button>
  <button id="mirror" class="on">镜像</button>
  <button id="motion">运动驱动</button>
  <button id="fps">FPS</button>
  <button id="wake">常亮</button>
  <span style="width:100%"></span>
  <button id="src-cam" class="on">相机</button>
  <button id="src-img">图片</button>
  <button id="src-vid">视频</button>
  <button id="src-test">测试图</button>
  <button id="rec">● 录制</button>
  <button id="shot">📷 截图</button>
  <a id="dl" style="display:none;color:#7fe0a0">下载</a>
  <span style="width:100%"></span>
  <button data-mode="0" class="on">万花筒</button>
  <button data-mode="1">隧道</button>
  <button data-mode="2">对称镜</button>
  <button data-mode="3">色散</button>
</div>
<script>
"use strict";
var msg = document.getElementById("msg");
function say(t){ msg.textContent = t; }

var S = { seg:4, rot:0, zoom:1, useTest:false, stream:null, facing:"environment",
          video:null, testCv:null, tex:null, gl:null, prog:null, t0:0,
          motion:false, prev:null, small:null, fps:0, fpsShow:false, frames:0, lastFps:0,
          mirror:true, wake:null, spin:0, mode:0,
          rec:null, chunks:[], recStart:0, recTimer:null };

var _q = new URLSearchParams(location.search);
var videoSrc = _q.get("src") || "";
var imgSrc = _q.get("img") || "";   // ?img=xxx.png 用静态图慢速平移（最稳的自证源）   // ?src=xxx.mp4 用视频当源（没相机时也能验证管线）

function initGL(){
  var c = document.getElementById("c");
  var gl = c.getContext("webgl", {antialias:false});
  if(!gl) throw new Error("WebGL 不可用");
  S.gl = gl;
  var vs = "attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}";
  var fs = [
    "precision highp float;",
    "varying vec2 uv;uniform sampler2D tex;uniform float seg,rot,zoom,aspect,t;",
    "uniform vec2 flip;uniform int mode;",
    "vec3 sampleAt(vec2 p){ return texture2D(tex, clamp(p,0.001,0.999)).rgb; }",
    "void main(){",
    "  vec2 u=(uv-.5)*vec2(aspect,1.0)*flip;",
    "  float c=cos(rot),s=sin(rot);",
    "  u=vec2(u.x*c-u.y*s,u.x*s+u.y*c);",
    "  float r=length(u); float a=atan(u.y,u.x);",
    "  vec3 col;",
    "  if(mode==0){",
    "    float segw=6.2831853/max(seg,1.0);",
    "    float aa=a+segw*0.5; aa=aa-segw*floor(aa/segw); a=abs(aa-segw*0.5);",
    "    vec2 k=vec2(cos(a),sin(a))*r/max(zoom,.001)/vec2(aspect,1.0)+.5;",
    "    col=sampleAt(k);",
    "    col*=mix(.82,1.0,smoothstep(.75,.35,r));",
    "  } else if(mode==1){",
    "    float rr=r*max(zoom,.2)*2.2 + t*0.15;",
    "    float segw=6.2831853/max(seg,1.0);",
    "    float aa=a+segw*0.5; aa=aa-segw*floor(aa/segw); a=abs(aa-segw*0.5);",
    "    vec2 k=vec2(cos(a),sin(a))*fract(rr)/vec2(aspect,1.0)+.5;",
    "    col=sampleAt(k)*smoothstep(1.0,0.2,r);",
    "  } else if(mode==2){",
    "    vec2 k=abs(u)/max(zoom,.001);",
    "    col=sampleAt(k/vec2(aspect,1.0)+.5);",
    "  } else {",
    "    float d=(.004+.004*sin(t*2.0))*max(zoom,.5);",
    "    vec2 k=u/max(zoom,.001)/vec2(aspect,1.0)+.5;",
    "    col=vec3(sampleAt(k+vec2(d,0)).r, sampleAt(k).g, sampleAt(k-vec2(d,0)).b);",
    "  }",
    "  gl_FragColor=vec4(col,1.0);",
    "}"
  ].join("\n");

  function mk(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error("shader: "+gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link: "+gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  S.prog = prog;

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  S.tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, S.tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
}

function resizeCanvas(){
  var c = document.getElementById("c"), dpr = Math.min(window.devicePixelRatio||1, 2);
  c.width = Math.floor(window.innerWidth*dpr);
  c.height = Math.floor(window.innerHeight*dpr);
  S.gl.viewport(0,0,c.width,c.height);
}

function testPattern(t){
  if(!S.testCv){ S.testCv = document.createElement("canvas"); S.testCv.width=960; S.testCv.height=960; }
  var x = S.testCv.getContext("2d"), N = 960;
  x.fillStyle = "#0b1018"; x.fillRect(0,0,N,N);
  for(var i=0;i<7;i++){
    x.beginPath(); x.arc(N/2,N/2,60+i*55,0,Math.PI*2);
    x.strokeStyle = "hsl("+((i*47+t*40)%360)+",80%,60%)"; x.lineWidth = 26; x.stroke();
  }
  for(var j=0;j<12;j++){
    var a = t*0.5 + j*Math.PI/6;
    x.beginPath(); x.moveTo(N/2,N/2);
    x.lineTo(N/2+Math.cos(a)*N*0.46, N/2+Math.sin(a)*N*0.46);
    x.strokeStyle = "hsla("+((j*30+t*60)%360)+",90%,65%,.5)"; x.lineWidth = 10; x.stroke();
  }
  x.fillStyle = "#fff"; x.beginPath(); x.arc(N/2,N/2,26,0,Math.PI*2); x.fill();
  return S.testCv;
}

function analyzeMotion(src){
  if(!S.small){ S.small = document.createElement("canvas"); S.small.width=32; S.small.height=32; }
  var x = S.small.getContext("2d");
  x.drawImage(src, 0, 0, 32, 32);
  var d = x.getImageData(0,0,32,32).data, sum=0, sx=0, sy=0;
  if(S.prev){
    for(var y=0;y<32;y++) for(var i=0;i<32;i++){
      var k=(y*32+i)*4, diff=Math.abs(d[k]-S.prev[k])+Math.abs(d[k+1]-S.prev[k+1]);
      if(diff>24){ sum++; sx+=i; sy+=y; }
    }
  }
  S.prev = d;
  if(sum > 12){                       // 有运动才驱动，静止不转
    return ((sx/sum)/32 - 0.5) * 0.9; // 横向偏移 → 角速度
  }
  return 0;
}

function frame(){
  var gl = S.gl, t = (performance.now() - S.t0)/1000;
  S.frames++;
  if(t - S.lastFps > 1){ S.fps = S.frames/(t-S.lastFps||1); S.frames=0; S.lastFps=t;
    if(S.fpsShow) say("FPS "+S.fps.toFixed(0)+(S.useTest?" · 测试图案":"")); }
  var src = null;
  var pic = imgSrc ? drawPic(t) : null;
  if(pic) src = pic;
  else if(S.video && S.video.readyState >= 2) src = S.video;
  else if(S.useTest) src = testPattern(t);
  if(src){
    gl.bindTexture(gl.TEXTURE_2D, S.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  }
  if(S.spin) S.rot += S.spin * 0.016;
  if(S.motion && src){
    S.rot += analyzeMotion(src) * 0.08;
  }
  var c = document.getElementById("c");
  gl.uniform1f(gl.getUniformLocation(S.prog,"seg"), S.seg);
  gl.uniform1f(gl.getUniformLocation(S.prog,"rot"), S.rot);
  gl.uniform1f(gl.getUniformLocation(S.prog,"zoom"), S.zoom);
  gl.uniform1f(gl.getUniformLocation(S.prog,"aspect"), c.width/Math.max(c.height,1));
  gl.uniform2f(gl.getUniformLocation(S.prog,"flip"), S.mirror?-1:1, 1);
  gl.uniform1f(gl.getUniformLocation(S.prog,"t"), t);
  gl.uniform1i(gl.getUniformLocation(S.prog,"mode"), S.mode|0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

function useVideo(){
  var v = document.createElement("video");
  // 有些 WebView 要求元素在文档里 + preload 才会真的拉流
  v.style.cssText = "position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";
  document.body.appendChild(v);
  v.preload = "auto";
  v.src = videoSrc; v.loop = true; v.muted = true; v.playsInline = true;
  v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
  v.load();
  v.addEventListener("canplay", function(){ v.play(); say("视频源：" + videoSrc.split("/").pop()); });
  v.addEventListener("error", function(){ S.useTest = true; say("视频载入失败："+videoSrc); });
  S.video = v;
}

var PIC = null, PIC_T0 = 0;
function useImage(){
  PIC = new Image();
  PIC.onload = function(){ PIC_T0 = performance.now(); say("图片源：" + imgSrc.split("/").pop()); };
  PIC.onerror = function(){ S.useTest = true; say("图片载入失败：" + imgSrc); };
  PIC.src = imgSrc;
}
function drawPic(t){
  if(!PIC || !PIC.complete || !PIC.naturalWidth){ return null; }
  if(!S.picCv){ S.picCv = document.createElement("canvas"); S.picCv.width = 1024; S.picCv.height = 1024; }
  var x = S.picCv.getContext("2d"), N = 1024;
  var z = 1.15 + 0.15 * Math.sin(t * 0.6);            // 呼吸式缩放，产生流动感
  var w = PIC.naturalWidth * z, h = PIC.naturalHeight * z;
  var dx = Math.sin(t * 0.35) * N * 0.06, dy = Math.cos(t * 0.28) * N * 0.06;
  x.fillStyle = "#000"; x.fillRect(0, 0, N, N);
  x.drawImage(PIC, (N - w) / 2 + dx, (N - h) / 2 + dy, w, h);
  return S.picCv;
}

function startCamera(){
  if(imgSrc){ useImage(); return; }
  if(videoSrc){ useVideo(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    S.useTest = true; say("这个环境不给相机（无 getUserMedia）· 已切换测试图案");
    return;
  }
  say("正在请求相机…");
  var done = false;
  var timer = setTimeout(function(){
    if(done) return;
    S.useTest = true;
    say("相机无响应（权限被拦或挂起）· 已切换测试图案 · Safari 打开 http://127.0.0.1:8080/kaleido/v3.html 可拿真相机");
  }, 2500);

  navigator.mediaDevices.getUserMedia({ video:{ facingMode:S.facing }, audio:false })
    .then(function(st){
      done = true; clearTimeout(timer);
      S.stream = st;
      var v = document.createElement("video");
      v.autoplay = true; v.muted = true; v.playsInline = true; v.srcObject = st;
      v.play().then(function(){ say("相机就绪 · 点屏幕切 UI"); }).catch(function(e){ say("播放失败："+e.name); });
      S.video = v;
    })
    .catch(function(e){
      done = true; clearTimeout(timer);
      S.useTest = true;
      say("相机失败："+e.name+" · 已切换测试图案");
    });
}

function bindUI(){
  window.addEventListener("resize", resizeCanvas);
  var ui = document.getElementById("ui");
  ui.addEventListener("click", function(e){
    var b = e.target; if(b.tagName !== "BUTTON") return;
    if(b.dataset.seg){
      S.seg = parseFloat(b.dataset.seg);
      [].forEach.call(ui.querySelectorAll("[data-seg]"), function(x){ x.classList.remove("on"); });
      b.classList.add("on"); return;
    }
    if(b.dataset.mode !== undefined){
      S.mode = parseInt(b.dataset.mode, 10);
      [].forEach.call(ui.querySelectorAll("[data-mode]"), function(x){ x.classList.remove("on"); });
      b.classList.add("on"); return;
    }
    if(b.dataset.preset === "slow"){ S.spin = 0.35; S.motion = false;
      ui.querySelector("#motion").classList.remove("on"); return; }
    if(b.dataset.preset === "tight"){ S.zoom = 1.8; S.seg = 3; return; }
    if(b.id === "mirror"){ S.mirror = !S.mirror; b.classList.toggle("on", S.mirror); return; }
    if(b.id === "wake"){ toggleWake(b); return; }
    if(b.id === "shot"){ snapshot(); return; }
    if(b.id === "src-cam"){ location.search = ""; return; }
    if(b.id === "src-img"){ location.search = "?img=src_pic.png"; return; }
    if(b.id === "src-vid"){ location.search = "?src=demo_short.mp4"; return; }
    if(b.id === "src-test"){ S.useTest = true; say("测试图案"); return; }
    if(b.id === "rec"){ (S.rec && S.rec.state === "recording") ? stopRec(b) : startRec(b); return; }
    if(b.id === "motion"){ S.motion = !S.motion; b.classList.toggle("on", S.motion);
      if(S.motion) S.spin = 0; return; }
    if(b.id === "fps"){ S.fpsShow = !S.fpsShow; b.classList.toggle("on", S.fpsShow); return; }
  });
  document.addEventListener("click", function(){ /* 预留 */ });
}

function snapshot(){
  var c = document.getElementById("c");
  c.toBlob(function(blob){
    if(!blob){ say("截图失败"); return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "beam-" + Date.now() + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    say("已截图 · " + (blob.size/1024).toFixed(0) + " KB · 去「文件→下载」里找，再用 gbt ingest 入库");
    // 顺手在屏上闪一下，让人知道拍到了
    var f = document.createElement("div");
    f.style.cssText = "position:fixed;inset:0;background:#fff;opacity:.6;z-index:99;pointer-events:none;transition:opacity .25s";
    document.body.appendChild(f);
    setTimeout(function(){ f.style.opacity = 0; setTimeout(function(){ f.remove(); }, 300); }, 60);
  }, "image/png");
}

function startRec(btn){
  var c = document.getElementById("c");
  if(!c.captureStream || !window.MediaRecorder){ say("这个浏览器不支持录制"); return; }
  var stream = c.captureStream(30);
  var types = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm"];
  var mime = types.find(function(t){ return MediaRecorder.isTypeSupported(t); }) || "";
  try{
    S.rec = mime ? new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: 8e6})
                 : new MediaRecorder(stream);
  }catch(e){ say("录制起不来："+e.name); return; }
  S.chunks = [];
  S.rec.ondataavailable = function(ev){ if(ev.data && ev.data.size) S.chunks.push(ev.data); };
  S.rec.onstop = function(){
    var blob = new Blob(S.chunks, {type: S.rec.mimeType || "video/webm"});
    var url = URL.createObjectURL(blob);
    var a = document.getElementById("dl");
    a.href = url; a.download = "spacebeam-" + Date.now() + (mime.indexOf("mp4") >= 0 ? ".mp4" : ".webm");
    a.style.display = "inline";
    say("录完 · " + (blob.size/1048576).toFixed(1) + " MB · 点“下载”保存");
  };
  S.rec.start(1000);
  S.recStart = performance.now();
  btn.classList.add("on");
  S.recTimer = setInterval(function(){
    var sec = (performance.now() - S.recStart) / 1000;
    btn.textContent = "■ " + sec.toFixed(0) + "s";
  }, 250);
  say("录制中…（" + (mime || "默认格式") + "）");
}

function stopRec(btn){
  if(S.rec && S.rec.state !== "inactive") S.rec.stop();
  clearInterval(S.recTimer);
  btn.classList.remove("on");
  btn.textContent = "● 录制";
}

function toggleWake(btn){
  if(S.wake){ S.wake.release(); S.wake = null; btn.classList.remove("on"); return; }
  if(!navigator.wakeLock){ say("这台设备不支持屏幕常亮 API"); return; }
  navigator.wakeLock.request("screen").then(function(w){
    S.wake = w; btn.classList.add("on");
    w.addEventListener("release", function(){ S.wake = null; btn.classList.remove("on"); });
  }).catch(function(e){ say("常亮失败："+e.name); });
}

// 双指：捏合缩放 + 旋转；单指拖动 = 旋转
function bindGestures(){
  var c = document.getElementById("c"), pts = {}, base = null;

  function two(){ var k = Object.keys(pts); return k.length >= 2 ? [pts[k[0]], pts[k[1]]] : null; }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function ang(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }

  c.addEventListener("pointerdown", function(e){
    pts[e.pointerId] = {x:e.clientX, y:e.clientY};
    var t = two();
    if(t){ base = { d: dist(t[0],t[1]), a: ang(t[0],t[1]), zoom: S.zoom, rot: S.rot }; }
  });
  c.addEventListener("pointermove", function(e){
    if(!pts[e.pointerId]) return;
    var prev = pts[e.pointerId];
    pts[e.pointerId] = {x:e.clientX, y:e.clientY};
    var t = two();
    if(t && base){
      S.zoom = Math.min(2.5, Math.max(0.4, base.zoom * (dist(t[0],t[1]) / (base.d || 1))));
      S.rot = base.rot + (ang(t[0],t[1]) - base.a);
    } else {
      S.rot += (e.clientX - prev.x) * 0.01;
    }
  });
  function up(e){ delete pts[e.pointerId]; if(!two()) base = null; }
  c.addEventListener("pointerup", up);
  c.addEventListener("pointercancel", up);

  // 点屏幕切 UI，3 秒后自动隐藏
  var hideT = null;
  function showUI(){ document.body.classList.add("ui");
    clearTimeout(hideT); hideT = setTimeout(function(){ document.body.classList.remove("ui"); }, 3000); }
  c.addEventListener("click", function(){ document.body.classList.toggle("ui"); showUI(); });
  showUI();
}

function boot(){
  try{
    S.t0 = performance.now();
    initGL();
    resizeCanvas();
    bindUI(); bindGestures();
    startCamera();
    requestAnimationFrame(frame);
  }catch(e){
    say("初始化失败：" + (e && e.message ? e.message : e));
    console.error(e);
  }
}
boot();
</script>
