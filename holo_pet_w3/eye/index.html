<!DOCTYPE html>
<html data-page-id="eye" lang="zh-CN">
<head>
<!-- gbt-apple-config --><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="小土豆V8"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0B1120"><meta name="format-detection" content="telephone=no"><style id="gbt-apple-css">:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}body{padding-top:calc(8px + var(--sat));padding-bottom:calc(8px + var(--sab));-webkit-text-size-adjust:100%}a,button{min-height:48px;min-width:48px;display:inline-block}</style>























<meta charset="utf-8" />
<!-- CSP：与神经工作台（brain）同一条 —— 离线自包含的硬保证。
 default-src 'none' + connect-src 'none' 把出网焊死；img-src 'self' data: 让
 frames/*.jpg（真帧）能显示；script-src 'self' 让经典脚本清单 frames.js 能加载。
 本页不能用 ES module：file:// 下 `<script type="module">` 会被 CORS 挡掉
 （实跑 `net::ERR_FAILED`，页面静默空白；壳的 main.cjs 没关 webSecurity）。 -->
<meta http-equiv="Content-Security-Policy"
 content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'" />
<title>GBT小土豆V8 · 触手视觉回传</title>
<link rel="stylesheet" href="../window.css" />
<link rel="stylesheet" href="../skin-mission-control.css" />
<link rel="stylesheet" href="../skin-omarchy.css" />
<link rel="stylesheet" href="eye.css" />
<link rel="stylesheet" href="../page-skins.css" />
</head>
<body class="gbt-body eye-app">
<script src="../shell/nav-compact.js"></script>

















































<header class="gbt-topbar">
<span class="eye-mark" aria-hidden="true"></span>
<div class="eye-brand">
<b>触手视觉回传</b>
<span class="eye-brand-sub">EYE‑01 · Tentacle Visual Return</span>
</div>
<span class="gbt-grow"></span>
<span class="eye-signal" id="signal">
<i class="eye-dot" id="signal-dot"></i><span id="signal-text">待机</span>
</span>
</header>

<main class="eye-main">
<!-- ══ 取景器：这一块里只出现真帧。没有帧就明说没有，不摆占位图。 ══ -->
<section class="eye-stage">
<div class="eye-view" id="view">
<img id="shot" alt="触手当前看到的画面（DXGI 直读帧缓冲）" />
<div class="eye-thirds" aria-hidden="true"></div>
<div class="eye-cross" aria-hidden="true"></div>
<span class="eye-corner tl" aria-hidden="true"></span>
<span class="eye-corner tr" aria-hidden="true"></span>
<span class="eye-corner bl" aria-hidden="true"></span>
<span class="eye-corner br" aria-hidden="true"></span>
<div class="eye-vig" aria-hidden="true"></div>
<!-- OSD：烧在画面角上的时间码。它是这一帧的真实抓帧时刻，不是装饰。 -->
<div class="eye-osd">
<span class="eye-rec" id="osd-rec"><i></i>REC</span>
<span id="osd-clock">--:--:--</span>
<span class="eye-osd-sep">|</span>
<span id="osd-seq">#---</span>
<span class="eye-osd-tag" id="osd-tag" hidden>回看</span>
</div>
<div class="eye-standby" id="standby">
<div class="eye-standby-title" id="standby-title">还没有帧</div>
<div class="eye-standby-body" id="standby-body">跑一次取帧就会有画面。</div>
</div>
</div>
<div class="mc-strip eye-telemetry" id="telemetry"></div>
</section>

<!-- ══ 右栏：回传胶片 + 这一帧的读数 ══ -->
<aside class="eye-rail">
<section class="mc-panel">
<div class="mc-panel-head"><span class="mc-panel-title">回传胶片</span>
<span class="eye-rail-note" id="ring-note">环形缓冲</span></div>
<div class="eye-film" id="filmstrip"><p class="eye-empty">读清单中…</p></div>
</section>
<section class="mc-panel">
<div class="mc-panel-head"><span class="mc-panel-title">这一帧的读数</span></div>
<div class="eye-detail" id="detail"><p class="eye-empty">读清单中…</p></div>
</section>
<section class="mc-panel">
<div class="mc-panel-head"><span class="mc-panel-title">这条通道</span></div>
<div class="eye-detail">
<p class="eye-note" id="chan-src">—</p>
<p class="eye-note" id="chan-via">—</p>
<p class="eye-note eye-note-hint">
 重抓：<code>py -3.14 tools/codex-scripts/eye-feed.py --loop</code>
</p>
</div>
</section>
</aside>
</main>

<!-- 清单 frames.js 故意不在 HTML 里静态引入：它是取帧器每 1.2 秒重写的产物，
 已按 .gitignore 排除（那份清单描述的是主人的屏幕，不入库）。
 静态引入会让全新检出必吃一个 404；改由 eye.js 首屏就走同一条动态加载路径，
 读不到时给的是结构化提示（"清单读不到 + 怎么生成"），不是一条无主的网络错。 -->
<script src="eye.js"></script>
<script src="../shell/tentacle-kit.js" defer></script>
</body>
</html>
