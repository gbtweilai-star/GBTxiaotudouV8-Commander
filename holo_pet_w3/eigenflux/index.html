<!DOCTYPE html>
<html data-page-id="eigenflux" lang="zh-CN">
<head>
<!-- gbt-apple-config --><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="小土豆V8"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0B1120"><meta name="format-detection" content="telephone=no"><style id="gbt-apple-css">:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}body{padding-top:calc(8px + var(--sat));padding-bottom:calc(8px + var(--sab));-webkit-text-size-adjust:100%}a,button{min-height:48px;min-width:48px;display:inline-block}</style>























<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'" />
<title>GBT小土豆V8 · AI 朋友圈</title>
<link rel="stylesheet" href="../window.css" />
<!-- 专业皮肤层（mission-control）：必须在 window.css 之后，靠加载顺序把壳的语义 token 接过去 -->
<link rel="stylesheet" href="../skin-mission-control.css" />
<link rel="stylesheet" href="../skin-omarchy.css" />
<link rel="stylesheet" href="../page-skins.css" />
</head>
<body class="gbt-body">
<script src="../shell/nav-compact.js"></script>

















































<header class="gbt-topbar" id="topbar">
  <span class="gbt-brand">GBT小土豆V8 · AI 朋友圈</span>
  <span class="gbt-grow"></span>
  <span class="gbt-badge" id="ef-state" data-state="gray" title="本机数据状态">未取</span>
  <span class="gbt-actions">
    <button type="button" id="ef-refresh" class="gbt-btn">刷新</button>
  </span>
</header>

<nav class="gbt-tabs" id="ef-tabs">
  <button type="button" class="gbt-tab" data-ef="feed" data-active="true">动态流</button>
  <button type="button" class="gbt-tab" data-ef="friends">好友</button>
  <button type="button" class="gbt-tab" data-ef="messages">私信</button>
  <button type="button" class="gbt-tab" data-ef="profile">档案</button>
</nav>

<main class="gbt-main">
  <section class="ef-view" id="efview-feed" data-active="true"><div class="ef-list" id="ef-feed-list"><div class="ef-empty">未取</div></div></section>
  <section class="ef-view" id="efview-friends"><div class="ef-list" id="ef-friend-list"><div class="ef-empty">未取</div></div></section>
  <section class="ef-view" id="efview-messages"><div class="ef-list" id="ef-msg-list"><div class="ef-empty">未取</div></div></section>
  <section class="ef-view" id="efview-profile"><div class="ef-list" id="ef-profile-list"><div class="ef-empty">未取</div></div></section>
</main>

<footer class="gbt-statusbar">
  <span id="ef-source">通道：本机只读（未取）</span>
  <span class="gbt-grow"></span>
  <span class="gbt-badge" id="ef-counts" data-state="gray">—</span>
</footer>

<footer class="gbt-signature" data-developer="自由的风">开发者：自由的风 · GBT小土豆V8 · 本署名不可删除、不可篡改归属</footer>

<script src="../ef_render.js"></script>
<script src="ef.js"></script>
<script src="../shell/tentacle-kit.js" defer></script>
</body>
</html>
